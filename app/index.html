<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLevel - Interaktiv Mathe lernen | Second-Order Resonance</title>
    <meta name="description" content="Kostenlose interaktive Mathe-App. Lerne Mathematik von Grundlagen bis Ingenieur-Level mit Übungen und Erklärungen.">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eee;
            --text-muted: #aaa;
            --gold: #f5c518;
            --success: #4ade80;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
        }

        /* App Header */
        .app-header {
            background: var(--secondary);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(233, 69, 96, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--gold);
        }

        .app-logo span { color: var(--accent); }

        .xp-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .xp-bar-track {
            width: 120px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 4px;
            transition: width 0.5s;
        }

        .xp-text { font-size: 0.85rem; color: var(--gold); }
        .streak { font-size: 0.9rem; }

        /* Main Layout */
        .app-main {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Level Selection */
        .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .level-btn {
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .level-btn:hover, .level-btn.active {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .level-btn .level-num {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
            margin-bottom: 0.3rem;
        }

        .level-btn .level-name { font-size: 0.8rem; color: var(--text-muted); }

        .l1 .level-num { color: #4ade80; }
        .l2 .level-num { color: #facc15; }
        .l3 .level-num { color: #f59e0b; }
        .l4 .level-num { color: #60a5fa; }
        .l5 .level-num { color: #8b5cf6; }
        .l6 .level-num { color: #6b7280; }

        /* Topic Selection */
        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .topic-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .topic-btn:hover, .topic-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Exercise Card */
        .exercise-card {
            background: var(--secondary);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .exercise-tag {
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .tag-easy { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .tag-medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .tag-hard { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .exercise-progress { color: var(--text-muted); font-size: 0.9rem; }

        .question {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .math-expression {
            font-size: 2rem;
            text-align: center;
            padding: 1.5rem;
            margin: 1.5rem 0;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            color: var(--gold);
        }

        /* Answer Options */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            padding: 1.2rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .option-btn:disabled { cursor: default; opacity: 0.7; }

        /* Feedback */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 12px;
            display: none;
        }

        .feedback.show { display: block; }

        .feedback.correct-fb {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .feedback.wrong-fb {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .feedback h4 { margin-bottom: 0.5rem; }
        .feedback p { color: var(--text-muted); line-height: 1.6; }

        .next-btn {
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: none;
        }

        .next-btn.show { display: block; }
        .next-btn:hover { background: #ff5a78; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            background: var(--secondary);
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); }

        /* YouTube CTA */
        .yt-cta {
            background: linear-gradient(135deg, var(--accent2), var(--secondary));
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .yt-cta h3 { margin-bottom: 0.5rem; }
        .yt-cta p { color: var(--text-muted); margin-bottom: 1rem; }

        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            background: #ff0000;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .yt-btn:hover { background: #cc0000; transform: translateY(-2px); }

        /* Locked level button */
        .level-btn.locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }

        /* Lock hint message */
        .lock-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            min-height: 1.4em;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--gold);
            color: #000;
            padding: 0.8rem 1.6rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Achievements */
        .achievements-section { margin-bottom: 2rem; }
        .achievements-title {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 0.7rem;
        }
        .achievement {
            background: var(--secondary);
            border-radius: 12px;
            padding: 0.8rem 0.4rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .achievement.earned {
            border-color: var(--gold);
            background: rgba(245, 197, 24, 0.08);
        }
        .achievement.not-earned { opacity: 0.3; filter: grayscale(1); }
        .achievement .ach-icon { font-size: 1.6rem; display: block; margin-bottom: 0.25rem; }
        .achievement .ach-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            line-height: 1.3;
            display: block;
        }
        .achievement.earned .ach-label { color: var(--gold); }

        /* Responsive */
        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
            .level-select { grid-template-columns: repeat(3, 1fr); }
            .level-btn { padding: 0.7rem 0.5rem; }
            .math-expression { font-size: 1.5rem; }
            .achievements-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- App Header -->
    <header class="app-header">

        <!-- Exercise -->
        <div class="exercise-card" id="exerciseCard">

                <span class="exercise-tag tag-easy" id="diffTag">Einfach</span>

        <!-- Achievements -->
        <div class="achievements-section">
            <div class="achievements-title">Abzeichen</div>

        </div>

        <!-- YouTube CTA -->
        <div class="yt-cta">
            <h3>Mehr davon auf YouTube</h3>
            <p>Ausführliche Video-Erklärungen zu jedem Thema mit Animationen und Beispielen</p>
            <a href="https://www.youtube.com/@Second-OrderResonance?sub_confirmation=1" target="_blank" class="yt-btn">
                Kanal abonnieren
            </a>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-top:0.8rem;">
                <a href="https://www.youtube.com/@Second-OrderResonance/search?query=Exponentielles%20Verhalten" target="_blank" class="yt-btn" style="padding:0.55rem 1rem;">Exponentielles Verhalten</a>
                <a href="https://www.youtube.com/@Second-OrderResonance/search?query=Gleichungen%20l%C3%B6sen%20und%20umstellen" target="_blank" class="yt-btn" style="padding:0.55rem 1rem;">Gleichungen lösen und umstellen</a>
            </div>
        </div>
    </main>

    <script>
        // Level XP thresholds: L1 always open, L2+ require XP
        const LEVEL_XP_THRESHOLDS = [0, 50, 150, 300, 500, 750];

        // Achievement definitions
        const ACHIEVEMENTS = [
            { id: 'first_correct', icon: '⭐', label: 'Erster Schritt',  desc: 'Erste richtige Antwort',   check: s => s.correct >= 1 },
            { id: 'ten_correct',   icon: '🎯', label: 'Zehn hoch',       desc: '10 richtige Antworten',     check: s => s.correct >= 10 },
            { id: 'fifty_correct', icon: '🏆', label: 'Mathe-Profi',     desc: '50 richtige Antworten',     check: s => s.correct >= 50 },
            { id: 'streak_3',      icon: '🔥', label: 'Auf Kurs',        desc: '3-Tage-Streak',             check: s => s.streak >= 3 },
            { id: 'streak_7',      icon: '💥', label: 'Wochenkämpfer',  desc: '7-Tage-Streak',             check: s => s.streak >= 7 },
            { id: 'xp_100',        icon: '💫', label: 'XP Sammler',      desc: '100 XP verdient',           check: s => s.xp >= 100 },
            { id: 'xp_500',        icon: '🌟', label: 'Level Up',        desc: '500 XP verdient',           check: s => s.xp >= 500 },
            { id: 'unlock_l2',     icon: '🔓', label: 'Aufsteiger',      desc: 'Level 2 freigeschaltet',    check: s => s.xp >= 50 },
            { id: 'unlock_l6',     icon: '🔬', label: 'Forscher',        desc: 'Level 6 freigeschaltet',    check: s => s.xp >= 750 }
        ];

        // Exercise Database
        const exercises = {
            0: { // Level 1 - Grundlagen
                topics: ["Bruchrechnung", "Prozente", "Geometrie", "Dreisatz"],
                questions: [
                    {
                        topic: "Bruchrechnung",
                        question: "Berechne:",
                        math: "1/2 + 1/3 = ?",
                        options: ["2/5", "5/6", "1/5", "2/6"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "Hauptnenner finden: 6. Also 3/6 + 2/6 = 5/6. Die Nenner müssen gleich sein, bevor man die Zähler addieren kann."
                    },
                    {
                        topic: "Bruchrechnung",
                        question: "Vereinfache:",
                        math: "12/18 = ?",
                        options: ["3/4", "2/3", "6/9", "4/6"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "GGT von 12 und 18 ist 6. Also 12/6 = 2 und 18/6 = 3. Ergebnis: 2/3."
                    },
                    {
                        topic: "Prozente",
                        question: "Berechne:",
                        math: "25% von 80 = ?",
                        options: ["15", "20", "25", "30"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "25% = 1/4. Also 80 / 4 = 20. Alternativ: 80 * 0.25 = 20."
                    },
                    {
                        topic: "Geometrie",
                        question: "Wie gro� ist die Fläche eines Kreises mit Radius r = 3?",
                        math: "A = pi * r^2 = ?",
                        options: ["9pi", "6pi", "3pi", "12pi"],
                        correct: 0,
                        difficulty: "easy",
                        explanation: "A = pi * r^2 = pi * 3^2 = pi * 9 = 9pi (ungefähr 28.27)."
                    },
                    {
                        topic: "Dreisatz",
                        question: "3 Äpfel kosten 1.50 Euro. Wie viel kosten 7 Äpfel?",
                        math: "3 -> 1.50 EUR\n7 -> ? EUR",
                        options: ["3.00", "3.50", "4.00", "4.50"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "1 Apfel = 1.50/3 = 0.50 EUR. Also 7 Äpfel = 7 * 0.50 = 3.50 EUR."
                    },
                    {
                        topic: "Bruchrechnung",
                        question: "Berechne:",
                        math: "5/8 - 1/4 = ?",
                        options: ["1/8", "3/8", "1/2", "5/4"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "1/4 entspricht 2/8. Also 5/8 - 2/8 = 3/8."
                    },
                    {
                        topic: "Prozente",
                        question: "Ein Pullover kostet 60 Euro und wird um 20% reduziert. Neuer Preis?",
                        math: "60 * (1 - 0,20) = ?",
                        options: ["42 Euro", "48 Euro", "50 Euro", "54 Euro"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "20% von 60 sind 12. Deshalb kostet der Pullover danach 48 Euro."
                    }
                ]
            },
            1: { // Level 2 - Aufbauwissen (Unter- & Mittelstufe)
                topics: ["Gleichungen", "Funktionen", "Trigonometrie", "Potenzen"],
                questions: [
                    {
                        topic: "Gleichungen",
                        question: "Löse nach x auf:",
                        math: "3x + 7 = 22",
                        options: ["x = 3", "x = 5", "x = 7", "x = 10"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "3x + 7 = 22 => 3x = 15 => x = 5. Immer erst Konstante subtrahieren, dann durch den Koeffizienten teilen."
                    },
                    {
                        topic: "Gleichungen",
                        question: "Löse die quadratische Gleichung:",
                        math: "x^2 - 5x + 6 = 0",
                        options: ["x = 1, x = 6", "x = 2, x = 3", "x = -2, x = -3", "x = 3, x = -2"],
                        correct: 1,
                        difficulty: "medium",
                        explanation: "Faktorisieren: (x-2)(x-3) = 0. Also x = 2 oder x = 3. Tipp: Welche Zahlen ergeben multipliziert 6 und addiert 5?"

                    {

            2: { // Level 3 - Vertiefung (Oberstufe / Schulabschlussniveau)

                questions: [
                    {

                        difficulty: "medium",
                        explanation: "Potenzregel: d/dx [x^n] = n*x^(n-1). Also: 3x^2 + 4x - 5. Jeder Term wird einzeln abgeleitet."
                    },
                    {
                        topic: "Ableitungen",

                    },
                    {

                    {
                        topic: "Regelungstechnik",
                        question: "Was beschreibt die Übertragungsfunktion eines PT1-Glieds?",
                        math: "G(s) = ?",
                        options: ["K/(1+Ts)", "K*s/(1+Ts)", "K/(s+T)", "K*T*s"],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "PT1-Glied (Verzögerungsglied 1. Ordnung): G(s) = K/(1+Ts) mit Verstärkung K und Zeitkonstante T. Grundbaustein der Regelungstechnik."
                    },
                    {
                        topic: "Fourier",
                        question: "Welche Eigenschaft hat die DFT (Diskrete Fourier-Transformation)?",
                        math: "X[k] = sum(n=0, N-1) x[n] * e^(-j2pi*kn/N)",
                        options: [
                            "Periodizität: X[k+N] = X[k]",
                            "X[k] ist immer reell",
                            "DFT ist nicht umkehrbar",
                            "Nur für gerade N definiert"
                        ],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "Die DFT ist periodisch mit Periode N. Außerdem ist sie umkehrbar (IDFT existiert) und für beliebiges N definiert."
                    },
                    {
                        topic: "Laplace",
                        question: "Bestimme die Laplace-Transformierte:",
                        math: "L{sin(wt)} = ?",
                        options: ["w/(s^2+w^2)", "s/(s^2+w^2)", "1/(s-w)", "w/(s-w)"],
                        correct: 0,

                        explanation: "Die Standardformel lautet L{sin(wt)} = w/(s^2 + w^2)."
                    },
                    {
                        topic: "Regelungstechnik",
                        question: "Welche Auswirkung hat höhere Dämpfung typischerweise?",
                        math: "c steigt",
                        options: [
                            "Kleinere Überschwingung",

                    {

                        options: ["Ordnung 4", "Ordnung 2", "Ordnung 1 (Euler)", "Ordnung 8"],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "RK4 hat globalen Fehler O(h^4). Die vier Stufen k1-k4 sind Steigungsschätzungen am Anfang, der Mitte (2x) und am Ende des Intervalls. Der lokale Fehler beträgt O(h^5)."

                    {
                        topic: "FEM",
                        question: "Was minimiert die Finite-Elemente-Methode bei einem elastischen Körper?",
                        math: "Pi(u) = 1/2 * int(sigma:epsilon dV) - int(f*u dV)",
                        options: [
                            "Das totale potentielle Energie-Funktional",
                            "Die maximale Spannung",
                            "Den Systemfehler im L2-Sinne",
                            "Die Anzahl der Freiheitsgrade"
                        ],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "FEM basiert auf dem Prinzip der minimalen potenziellen Energie (Variationsprinzip). Das schwache Äquivalent der starken Form wird durch Galerkin-Ansätze diskretisiert: Ku = f."

                    {

                        question: "Was sind die Karush-Kuhn-Tucker (KKT) Bedingungen?",

                        options: [
                            "Notwendige Optimalitätsbedingungen mit Lagrange-Multiplikatoren",

                        explanation: "KKT-Bedingungen verallgemeinern Lagrange-Multiplikatoren auf Ungleichungsnebenbedingungen. Sie sind notwendig (bei Konvexität auch hinreichend) für lokale Optima. Kernbedingung: Gradient der Lagrange-Funktion = 0."
                    },
                    {
                        topic: "Numerik",
                        question: "Wie skaliert der Speicherbedarf einer dichten N x N Matrix?",
                        math: "Anzahl der Einträge",
                        options: ["O(N)", "O(N log N)", "O(N^2)", "O(2^N)"],
                        correct: 2,

                        explanation: "Eine dichte Matrix besitzt N^2 Einträge, daher ist der Speicherbedarf quadratisch."

                        math: "x_{k+1} = x_k - alpha * grad f(x_k)",

                            "Schritt in Richtung des negativen Gradienten",

                            "Immer exakt globales Optimum",
                            "Nur für lineare Modelle"

                        explanation: "Das Verfahren bewegt sich entlang des negativen Gradienten in Richtung lokaler Abnahme."

                ]
            }
        };

        // App State
        let state = {
            level: 0,
            topic: null,
            questionIdx: 0,
            correct: 0,
            total: 0,
            xp: 0,
            streak: 0,
            lastSessionDate: null,
            earnedAchievements: [],
            answered: false
        };

        // Load saved state
        try {
            const saved = localStorage.getItem('mathlevel-state');
            if (saved) {
                const s = JSON.parse(saved);
                state.correct = s.correct || 0;
                state.total = s.total || 0;
                state.xp = s.xp || 0;
                state.streak = s.streak || 0;
                state.lastSessionDate = s.lastSessionDate || null;
                state.earnedAchievements = s.earnedAchievements || [];

                // Reset streak if last session was more than 1 day ago
                const today = new Date().toISOString().slice(0, 10);
                const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
                if (state.lastSessionDate !== today && state.lastSessionDate !== yesterday) {
                    state.streak = 0;
                }
            }
        } catch(e) {}

        function saveState() {
            try {
                const today = new Date().toISOString().slice(0, 10);
                if (state.lastSessionDate !== today) {
                    state.streak = (state.streak || 0) + 1;
                    state.lastSessionDate = today;
                }
                localStorage.setItem('mathlevel-state', JSON.stringify({
                    correct: state.correct,
                    total: state.total,
                    xp: state.xp,
                    streak: state.streak,
                    lastSessionDate: state.lastSessionDate,
                    earnedAchievements: state.earnedAchievements
                }));
            } catch(e) {}
        }

        function isLevelUnlocked(idx) {
            return state.xp >= LEVEL_XP_THRESHOLDS[idx];
        }

        function renderLevelButtons() {
            const levelNames = ['Grundlagen', 'Aufbauwissen', 'Vertiefung', 'Universit�tsgrundlagen', 'Angewandte Mathematik', 'Forschung & Simulation'];
            document.querySelectorAll('.level-btn').forEach((btn, i) => {
                const unlocked = isLevelUnlocked(i);
                btn.classList.toggle('locked', !unlocked);
                btn.disabled = !unlocked;
                btn.classList.toggle('active', i === state.level);
                const nameEl = btn.querySelector('.level-name');
                if (nameEl) nameEl.textContent = unlocked ? levelNames[i] : '🔒 ' + (LEVEL_XP_THRESHOLDS[i]) + ' XP';
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function checkAchievements() {
            let newlyEarned = false;
            ACHIEVEMENTS.forEach(a => {
                if (!state.earnedAchievements.includes(a.id) && a.check(state)) {
                    state.earnedAchievements.push(a.id);
                    showToast(a.icon + ' ' + a.label + ' freigeschaltet!');
                    newlyEarned = true;
                }
            });
            if (newlyEarned) renderAchievements();
        }

        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            grid.innerHTML = ACHIEVEMENTS.map(a => {
                const earned = state.earnedAchievements.includes(a.id);
                return `<div class="achievement ${earned ? 'earned' : 'not-earned'}" title="${a.desc}">
                    <span class="ach-icon">${a.icon}</span>
                    <span class="ach-label">${a.label}</span>
                </div>`;
            }).join('');
        }

        function selectLevel(level) {
            if (!isLevelUnlocked(level)) {
                const needed = LEVEL_XP_THRESHOLDS[level] - state.xp;
                const msg = document.getElementById('lockMsg');
                msg.textContent = '🔒 Noch ' + needed + ' XP für Level ' + (level + 1);
                setTimeout(() => { if (msg.textContent.startsWith('🔒')) msg.textContent = ''; }, 2500);
                return false;
            }
            document.getElementById('lockMsg').textContent = '';
            state.level = level;
            state.topic = null;
            state.questionIdx = 0;
            state.answered = false;

            renderLevelButtons();
            renderTopics();
            renderExercise();
            return true;
        }

        function openLevelFromHash() {
            const match = window.location.hash.match(/^#level-([1-6])$/);
            if (!match) return;
            const levelIdx = Number(match[1]) - 1;
            const opened = selectLevel(levelIdx);
            if (opened) {
                const target = document.getElementById('exerciseCard');
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderTopics() {
            const container = document.getElementById('topicsContainer');
            const topics = exercises[state.level].topics;
            container.innerHTML = topics.map(t =>
                `<button class="topic-btn ${state.topic === t ? 'active' : ''}" onclick="selectTopic('${t}')">${t}</button>`
            ).join('');
        }

        function selectTopic(topic) {
            state.topic = state.topic === topic ? null : topic;
            state.questionIdx = 0;
            state.answered = false;
            renderTopics();
            renderExercise();
        }

        function getFilteredQuestions() {
            let qs = exercises[state.level].questions;
            if (state.topic) {
                qs = qs.filter(q => q.topic === state.topic);
            }
            return qs;
        }

        function renderExercise() {
            const qs = getFilteredQuestions();
            if (qs.length === 0) return;

            const q = qs[state.questionIdx % qs.length];

            // Difficulty tag
            const tag = document.getElementById('diffTag');
            tag.textContent = q.difficulty === 'easy' ? 'Einfach' : q.difficulty === 'medium' ? 'Mittel' : 'Schwer';
            tag.className = 'exercise-tag tag-' + q.difficulty;

            // Progress
            document.getElementById('progressText').textContent = `Aufgabe ${state.questionIdx + 1}`;

            // Question
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('mathExpr').textContent = q.math;

            // Options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = q.options.map((opt, i) =>
                `<button class="option-btn" onclick="checkAnswer(${i}, ${q.correct})" id="opt${i}">${opt}</button>`
            ).join('');

            // Hide feedback
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            state.answered = false;
        }

        function checkAnswer(selected, correct) {
            if (state.answered) return;
            state.answered = true;
            state.total++;

            const isCorrect = selected === correct;
            const feedback = document.getElementById('feedback');
            const qs = getFilteredQuestions();
            const q = qs[state.questionIdx % qs.length];

            // Highlight options
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) btn.classList.add('correct');
                if (i === selected && !isCorrect) btn.classList.add('wrong');
            });

            if (isCorrect) {
                state.correct++;
                const xpGain = q.difficulty === 'easy' ? 10 : q.difficulty === 'medium' ? 20 : 30;
                state.xp += xpGain;
                feedback.className = 'feedback correct-fb show';
                document.getElementById('feedbackTitle').textContent = 'Richtig! +' + xpGain + ' XP';
            } else {
                feedback.className = 'feedback wrong-fb show';
                document.getElementById('feedbackTitle').textContent = 'Leider falsch';
            }

            document.getElementById('feedbackText').textContent = q.explanation;
            document.getElementById('nextBtn').className = 'next-btn show';

            updateStats();
            saveState();
            checkAchievements();
        }

        function nextExercise() {
            state.questionIdx++;
            renderExercise();
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = state.correct;
            document.getElementById('totalCount').textContent = state.total;
            document.getElementById('accuracyPct').textContent =
                state.total > 0 ? Math.round(state.correct / state.total * 100) + '%' : '-';
            document.getElementById('xpText').textContent = state.xp + ' XP';
            document.getElementById('xpFill').style.width = (state.xp % 500) / 5 + '%';
            document.getElementById('streak').textContent = state.streak + ' Tage';
            renderLevelButtons();
        }

        // Initialize
        renderLevelButtons();
        renderTopics();
        renderExercise();
        updateStats();
        renderAchievements();
        openLevelFromHash();
        window.addEventListener('hashchange', openLevelFromHash);
    </script>
