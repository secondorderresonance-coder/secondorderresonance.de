<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernpfad | Second-Order Resonance</title>
    <meta name="description" content="Dein persönlicher Mathe-Lernpfad – spielerisch von Einmaleins bis Forschung.">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --bg:         #1a1a2e;
            --secondary:  #16213e;
            --accent:     #e94560;
            --text:       #eef;
            --muted:      #9aa;
            --gold:       #f5c518;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* ── TOP BAR ── */
        .topbar {
            position:sticky; top:0; z-index:200;
            background:var(--secondary);
            border-bottom:2px solid rgba(233,69,96,.25);
            display:flex; align-items:center; justify-content:space-between;
            padding:.7rem 1.2rem; gap:.8rem;
        }
        .logo { font-weight:800; font-size:1.1rem; color:var(--gold); text-decoration:none; }
        .logo span { color:var(--accent); }
        .tb-stats { display:flex; align-items:center; gap:1rem; font-size:.82rem; }
        .tb-stat { display:flex; align-items:center; gap:.3rem; }
        .tb-stat-val { font-weight:700; color:var(--gold); }
        .tb-stat-icon { font-size:1rem; }
        .tb-login-btn {
            padding:.38rem .9rem; border-radius:20px;
            background:var(--accent); color:#fff; border:none;
            font-size:.82rem; font-weight:700; cursor:pointer; transition:opacity .2s;
        }
        .tb-login-btn:hover { opacity:.85; }
        .tb-avatar {
            width:30px; height:30px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:.78rem; color:#fff; cursor:pointer;
            border:2px solid var(--gold);
        }

        /* ── MODAL OVERLAY ── */
        .overlay {
            position:fixed; inset:0; z-index:500;
            background:rgba(0,0,0,.72); display:none;
            align-items:center; justify-content:center; padding:1rem;
        }
        .overlay.open { display:flex; }
        .modal {
            background:var(--secondary); border-radius:20px;
            padding:2rem 1.8rem; width:100%; max-width:380px;
            border:1px solid rgba(255,255,255,.1);
            animation:popIn .22s ease;
        }
        @keyframes popIn { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
        .modal-title { font-size:1.3rem; font-weight:800; text-align:center; margin-bottom:1.4rem; }
        .modal-tabs { display:flex; gap:.5rem; margin-bottom:1.4rem; }
        .modal-tab {
            flex:1; padding:.5rem; border-radius:10px; border:none;
            font-size:.88rem; font-weight:700; cursor:pointer;
            background:rgba(255,255,255,.06); color:var(--muted);
            transition:all .2s;
        }
        .modal-tab.active { background:var(--accent); color:#fff; }
        .modal-field {
            width:100%; padding:.7rem .9rem; border-radius:10px;
            background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
            color:var(--text); font-size:.92rem; margin-bottom:.75rem; outline:none;
            transition:border-color .2s;
        }
        .modal-field:focus { border-color:rgba(233,69,96,.55); }
        .modal-submit {
            width:100%; padding:.75rem; border-radius:12px;
            background:var(--accent); color:#fff; border:none;
            font-size:1rem; font-weight:800; cursor:pointer; margin-top:.3rem;
            transition:opacity .2s;
        }
        .modal-submit:hover { opacity:.88; }
        .modal-err { color:#f87171; font-size:.8rem; text-align:center; margin-top:.5rem; min-height:1.1rem; }
        .modal-close-row { text-align:right; margin-bottom:.5rem; }
        .modal-close { background:none; border:none; color:var(--muted); font-size:1.3rem; cursor:pointer; }

        /* ── GUEST HERO ── */
        .guest-hero {
            text-align:center; padding:3rem 1.5rem 1.5rem;
            max-width:520px; margin:0 auto;
        }
        .guest-hero h1 { font-size:1.9rem; font-weight:800; line-height:1.2; margin-bottom:.7rem; }
        .guest-hero h1 em { color:var(--accent); font-style:normal; }
        .guest-hero p { color:var(--muted); font-size:.95rem; margin-bottom:1.5rem; }
        .hero-cta {
            display:inline-block; padding:.85rem 2.2rem; border-radius:50px;
            background:var(--accent); color:#fff; font-size:1.05rem; font-weight:800;
            text-decoration:none; border:none; cursor:pointer;
            animation:pulseCta 2s ease-in-out infinite;
        }
        @keyframes pulseCta {
            0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.5)}
            50%{box-shadow:0 0 0 12px rgba(233,69,96,0)}
        }

        /* ── MAP CONTAINER ── */
        .map-wrap {
            max-width:480px; margin:0 auto;
            padding:1.5rem 1rem 5rem;
        }

        /* ── LEVEL BANNER ── */
        .lvl-banner {
            display:flex; align-items:center; gap:.9rem;
            background:var(--secondary); border-radius:16px;
            padding:.9rem 1.2rem; margin:2rem 0 .8rem;
            border:1px solid rgba(255,255,255,.08);
        }
        .lvl-badge {
            width:44px; height:44px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:1rem; font-weight:900; color:#fff; flex-shrink:0;
            border:3px solid;
        }
        .lvl-info { flex:1; }
        .lvl-name { font-weight:800; font-size:1rem; }
        .lvl-sub  { font-size:.75rem; color:var(--muted); margin-top:.1rem; }
        .lvl-xp-track {
            height:5px; border-radius:3px;
            background:rgba(255,255,255,.1); margin-top:.45rem; overflow:hidden;
        }
        .lvl-xp-fill { height:100%; border-radius:3px; transition:width .5s; }
        .lvl-xp-txt { font-size:.7rem; color:var(--muted); margin-top:.2rem; }
        .lvl-lock-badge {
            font-size:.8rem; color:var(--muted); white-space:nowrap;
            display:flex; align-items:center; gap:.3rem;
        }

        /* ── SKILL NODES ── */
        .nd {
            position:relative; display:flex; flex-direction:column;
            align-items:center; margin-bottom:1.1rem;
        }
        .nd-circle {
            width:68px; height:68px; border-radius:50%;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            border:4px solid; cursor:pointer; transition:transform .15s, box-shadow .15s;
            position:relative; text-decoration:none;
            flex-shrink:0;
        }
        .nd-icon { font-size:1.5rem; line-height:1; }
        .nd-label-icon { font-size:1.1rem; line-height:1; font-weight:800; color:#fff; }
        .nd-label-below {
            margin-top:.35rem; font-size:.72rem; font-weight:700;
            text-align:center; max-width:80px; color:var(--muted); line-height:1.2;
        }

        /* locked */
        .nd.nd-locked .nd-circle {
            background:#1e2a3a; border-color:#2d3d50;
            cursor:default; pointer-events:none;
        }
        .nd.nd-locked .nd-label-icon { color:#3d5060; }
        .nd.nd-locked .nd-label-below { color:#3d5060; }

        /* active */
        .nd.nd-active .nd-circle {
            box-shadow:0 0 18px var(--nd-color,#e94560);
            border-color:var(--nd-color,#e94560);
            background:var(--nd-bg,rgba(233,69,96,.18));
            animation:ndBounce 1.6s ease-in-out infinite;
        }
        @keyframes ndBounce {
            0%,100%{transform:translateY(0)}
            45%{transform:translateY(-6px)}
        }
        .nd.nd-active .nd-circle:hover { transform:scale(1.06); }

        /* done */
        .nd.nd-done .nd-circle {
            border-color:var(--nd-color,#4ade80);
            background:var(--nd-color,#4ade80);
        }
        .nd.nd-done .nd-label-icon { color:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
        .nd-done-badge {
            position:absolute; bottom:-4px; right:-4px;
            width:20px; height:20px; border-radius:50%;
            background:#22c55e; border:2px solid var(--bg);
            display:flex; align-items:center; justify-content:center;
            font-size:.65rem; color:#fff; font-weight:900; display:none;
        }
        .nd.nd-done .nd-done-badge { display:flex; }

        /* ── BACK LINK ── */
        .back-link {
            display:inline-flex; align-items:center; gap:.4rem;
            color:var(--muted); font-size:.82rem; text-decoration:none;
            padding:.35rem .7rem; border-radius:8px;
            border:1px solid rgba(255,255,255,.1); transition:all .2s;
        }
        .back-link:hover { color:var(--text); border-color:rgba(255,255,255,.25); }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
    <a href="index.html" class="logo">SOR<span>·</span>Mathe</a>
    <div class="tb-stats" id="tbStats">
        <button class="tb-login-btn" id="tbLoginBtn" onclick="openModal()">Anmelden</button>
    </div>
    <a href="index.html" class="back-link">&#8592; App</a>
</header>

<!-- ACCOUNT MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-close-row">
            <button class="modal-close" onclick="closeModal()">&#x2715;</button>
        </div>
        <div class="modal-title" id="modalTitle">Willkommen</div>
        <div class="modal-tabs">
            <button class="modal-tab active" id="tabReg" onclick="switchTab('reg')">Registrieren</button>
            <button class="modal-tab" id="tabLog" onclick="switchTab('log')">Anmelden</button>
        </div>
        <input class="modal-field" id="mUser" type="text" placeholder="Benutzername" autocomplete="username" />
        <input class="modal-field" id="mPass" type="password" placeholder="Passwort" autocomplete="current-password" />
        <button class="modal-submit" onclick="doSubmit()">Los geht&rsquo;s!</button>
        <div class="modal-err" id="modalErr"></div>
    </div>
</div>

<!-- GUEST HERO (shown when not logged in) -->
<section class="guest-hero" id="guestHero" style="display:none">
    <h1>Mathe lernen –<br><em>Level für Level</em></h1>
    <p>Von Einmaleins bis Forschung. Spielerisch, kostenlos, mit echtem Fortschritt.</p>
    <button class="hero-cta" onclick="openModal()">Jetzt starten &rarr;</button>
</section>

<!-- MAP -->
<div class="map-wrap" id="mapWrap"></div>

<script>
const STORE_KEY = 'mathlevel-accounts-v1';
const LVL_XP = [0, 50, 150, 300, 500, 750, 1100];
const LVL_COLORS = ['#4ade80','#facc15','#f59e0b','#60a5fa','#8b5cf6','#9ca3af'];
const LVL_BG = [
    'rgba(74,222,128,.2)','rgba(250,204,21,.2)','rgba(245,158,11,.2)',
    'rgba(96,165,250,.2)','rgba(139,92,246,.2)','rgba(156,163,175,.2)'
];
const LVL_NAMES = ['Grundlagen','Aufbauwissen','Vertiefung','Uni-Grundlagen','Angewandte Mathe','Forschung'];
const LVL_SUBS  = ['Grundschule & Unterstufe','Unter- & Mittelstufe','Oberstufe','Studienanfang','Fortgeschrittenes Studium','Wissenschaft & Spezialisierung'];

/* 12 nodes per level — [icon, label, appTopic] */
const NODES = [
    /* L1 */ [
        ['✕','Einmaleins','Einmaleins'],
        ['＋','Addition','Addition'],
        ['½','Brüche','Bruchrechnung'],
        ['÷','Brüche÷','Bruch-Division'],
        ['0.1','Dezimal','Dezimalzahlen'],
        ['%','Prozente','Prozente'],
        ['∝','Dreisatz','Dreisatz'],
        ['▭','Flächen','Flächenberechnung'],
        ['⬡','Umfang','Umfang'],
        ['∠','Winkel','Winkel'],
        ['⊕','Koordinaten','Koordinatensystem'],
        ['🎯','Gemischt','Gemischt L1'],
    ],
    /* L2 */ [
        ['=','Lin.Gl.','Lineare Gleichungen'],
        ['x²','Quad.Gl.','Quadratische Gleichungen'],
        ['xⁿ','Potenzen','Potenzen'],
        ['√','Wurzeln','Wurzeln'],
        ['log','Logarithmus','Logarithmus'],
        ['f(x)','Lin.Fkt.','Lineare Funktionen'],
        ['⌒','Parabeln','Parabeln'],
        ['sin','Sinus','Trigonometrie-sin'],
        ['tan','Tangens','Trigonometrie-tan'],
        ['○','Einheitskr.','Einheitskreis'],
        ['‖','GLS','Gleichungssysteme'],
        ['🔍','Fkt-Ana.','Funktionsanalyse'],
    ],
    /* L3 */ [
        ["f'","Ableitung","Ableitungen"],
        ['⛓','Kettenregel','Kettenregel'],
        ['·','Produktregel','Produktregel'],
        ['📉','Kurvendisk.','Kurvendiskussion'],
        ['∫','Stammfkt.','Stammfunktion'],
        ['∫₀¹','Best.Int.','Bestimmtes Integral'],
        ['∫uv','Part.Int.','Partielle Integration'],
        ['P','Wahrsch.','Wahrscheinlichkeit'],
        ['nCr','Kombi','Kombinatorik'],
        ['B(n)','Binom.','Binomialverteilung'],
        ['→','Vektoren','Vektoren'],
        ['⊥','Geraden','Geraden & Ebenen'],
    ],
    /* L4 */ [
        ['[M]','Matrizen','Lineare Algebra'],
        ['det','det(A)','Determinante'],
        ['λ','Eigenwerte','Eigenwerte'],
        ["y'","DGL 1.O","Differentialgleichungen 1. Ordnung"],
        ["y''","DGL 2.O","Differentialgleichungen 2. Ordnung"],
        ['i','Komplex','Komplexe Zahlen'],
        ['eⁱ','Euler-F.','Eulersche Formel'],
        ['|z|','Betrag','Komplexe Zahlen'],
        ['Σxⁿ','Potenzreihe','Reihen'],
        ['∞','Konvergenz','Konvergenz'],
        ['eˣ≈','Taylor','Taylorreihe'],
        ['ℒ','Laplace','Laplace-Transformation'],
    ],
    /* L5 */ [
        ['∿','Fourier-R','Fourierreihe'],
        ['F(ω)','Fourier-T','Fouriertransformation'],
        ['DFT','DFT','Diskrete Fouriertransformation'],
        ['ℒ','Laplace','Laplace-Transformation'],
        ['G(s)','Übertr.','Übertragungsfunktion'],
        ['ω₀','Resonanz','Resonanz'],
        ['~','Schwingung','Schwingungen'],
        ['⚙','PID','Regelungstechnik'],
        ['✓','Stabilität','Stabilitätsanalyse'],
        ['Q','Güte','Gütefaktor'],
        ['📡','Signal','Signalverarbeitung'],
        ['⧖','Filter','Filtertechnik'],
    ],
    /* L6 */ [
        ['∂','PDE','Partielle DGL'],
        ['∿','Welle','Wellengleichung'],
        ['🌡','Wärme','Wärmeleitungsgleichung'],
        ['⬡','FEM','Finite-Elemente-Methode'],
        ['N(x)','Formfkt.','FEM-Formfunktionen'],
        ['≈','FDiff.','Finite-Differenzen-Methode'],
        ['→','RK4','Runge-Kutta Verfahren'],
        ['O(h)','Fehler','Fehlerordnung'],
        ['W(t)','Wiener','Wiener-Prozess'],
        ['dX','Itô','Itô-Formel'],
        ['∇','KKT','KKT-Bedingungen'],
        ['↗','Konvex','Konvexe Optimierung'],
    ],
];

/* winding S-curve offsets for 12 nodes: 8 positions cycling L→R */
const WIND = [8, 28, 50, 70, 50, 28, 8, 28, 50, 70, 50, 28];

/* ── account helpers ── */
function loadStore()  { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {accounts:{},current:null}; } catch(e){ return {accounts:{},current:null}; } }
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function currentAccount() {
    const s = loadStore();
    if (!s.current || !s.accounts[s.current]) return null;
    return s.accounts[s.current];
}
function getXp() {
    const a = currentAccount();
    return (a && a.progress && a.progress.summary && a.progress.summary.xp) || 0;
}
function getStreak() {
    const a = currentAccount();
    return (a && a.progress && a.progress.summary && a.progress.summary.streak) || 0;
}
function avatarColor(username) {
    let h = 0;
    for (let i = 0; i < username.length; i++) h = username.charCodeAt(i) + ((h << 5) - h);
    return 'hsl(' + (h % 360) + ',55%,50%)';
}
function normalizeAccount(u, p) {
    return {
        username: u, password: p,
        avatarColor: avatarColor(u),
        createdAt: new Date().toISOString(),
        hearts: 5, heartsLastRefill: Date.now(),
        streakFreezes: 0, streakFreezeUsed: null,
        progress: {
            schemaVersion: 1, summary: { xp:0, streak:0, accuracy:0, correct:0 },
            dailyActivity: {}, weeklyXp: {}, lastActiveDate: null, updatedAt: null
        }
    };
}

/* ── modal ── */
let modalMode = 'reg';
function openModal()  { document.getElementById('overlay').classList.add('open'); document.getElementById('mUser').focus(); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); document.getElementById('modalErr').textContent=''; }
function switchTab(t) {
    modalMode = t;
    document.getElementById('tabReg').classList.toggle('active', t==='reg');
    document.getElementById('tabLog').classList.toggle('active', t==='log');
    document.getElementById('modalTitle').textContent = t==='reg' ? 'Konto erstellen' : 'Willkommen zurück';
    document.getElementById('modalErr').textContent = '';
}
document.getElementById('mPass').addEventListener('keydown', e => { if(e.key==='Enter') doSubmit(); });

function doSubmit() {
    const u = document.getElementById('mUser').value.trim();
    const p = document.getElementById('mPass').value;
    const err = document.getElementById('modalErr');
    if (!u || !p) { err.textContent='Bitte alle Felder ausfüllen.'; return; }
    const s = loadStore();
    if (modalMode === 'reg') {
        if (s.accounts[u]) { err.textContent='Benutzername bereits vergeben.'; return; }
        if (p.length < 4)  { err.textContent='Passwort mind. 4 Zeichen.'; return; }
        s.accounts[u] = normalizeAccount(u, p);
        s.current = u;
        saveStore(s);
    } else {
        const acc = s.accounts[u];
        if (!acc || acc.password !== p) { err.textContent='Benutzername oder Passwort falsch.'; return; }
        s.current = u;
        saveStore(s);
    }
    closeModal();
    init();
}

/* ── node state ── */
function nodeState(lvl, idx) {
    const xp  = getXp();
    const ls  = LVL_XP[lvl];
    const le  = LVL_XP[lvl + 1] || ls + 350;
    const per = (le - ls) / 12;
    if (xp < ls) return 'locked';
    if (xp >= ls + (idx + 1) * per) return 'done';
    if (xp >= ls + idx * per) return 'active';
    return 'locked';
}

/* ── render ── */
function renderTopBar(acc) {
    const tb = document.getElementById('tbStats');
    const xp = getXp();
    const streak = getStreak();
    if (!acc) {
        tb.innerHTML = '<button class="tb-login-btn" onclick="openModal()">Anmelden</button>';
        return;
    }
    tb.innerHTML = `
        <div class="tb-stat"><span class="tb-stat-icon">⚡</span><span class="tb-stat-val">${xp}</span><span style="color:var(--muted);font-size:.78rem">XP</span></div>
        <div class="tb-stat"><span class="tb-stat-icon">🔥</span><span class="tb-stat-val">${streak}</span></div>
        <div class="tb-avatar" style="background:${acc.avatarColor}" onclick="window.location='profil.html'">${acc.username.charAt(0).toUpperCase()}</div>
    `;
}

function renderMap(xp) {
    const wrap = document.getElementById('mapWrap');
    wrap.innerHTML = '';

    for (let lvl = 0; lvl < 6; lvl++) {
        const col   = LVL_COLORS[lvl];
        const bg    = LVL_BG[lvl];
        const ls    = LVL_XP[lvl];
        const le    = LVL_XP[lvl + 1] || ls + 350;
        const isUnl = xp >= ls;
        const xpIn  = Math.max(0, Math.min(xp - ls, le - ls));
        const pct   = isUnl ? Math.round(xpIn / (le - ls) * 100) : 0;

        /* level banner */
        const banner = document.createElement('div');
        banner.className = 'lvl-banner';
        banner.innerHTML = `
            <div class="lvl-badge" style="background:${isUnl?col:'#1e2a3a'};border-color:${isUnl?col:'#2d3d50'}">
                ${lvl+1}
            </div>
            <div class="lvl-info">
                <div class="lvl-name" style="color:${isUnl?col:getComputedStyle(document.documentElement).getPropertyValue('--muted')}">${LVL_NAMES[lvl]}</div>
                <div class="lvl-sub">${LVL_SUBS[lvl]}</div>
                ${isUnl
                    ? `<div class="lvl-xp-track"><div class="lvl-xp-fill" style="width:${pct}%;background:${col}"></div></div>
                       <div class="lvl-xp-txt">${xpIn} / ${le-ls} XP</div>`
                    : `<div class="lvl-xp-txt" style="margin-top:.4rem">🔒 ${ls} XP zum Freischalten</div>`
                }
            </div>
        `;
        wrap.appendChild(banner);

        /* nodes */
        NODES[lvl].forEach((nd, i) => {
            const state = nodeState(lvl, i);
            const ml    = WIND[i % WIND.length];

            const outer = document.createElement('div');
            outer.className = `nd nd-${state}`;
            outer.style.marginLeft = ml + '%';
            outer.style.setProperty('--nd-color', col);
            outer.style.setProperty('--nd-bg', bg);

            const circle = document.createElement(state !== 'locked' ? 'a' : 'div');
            circle.className = 'nd-circle';
            circle.style.borderColor = state === 'locked' ? '#2d3d50'
                                     : state === 'done'   ? col
                                     : col;
            circle.style.background  = state === 'locked' ? '#1e2a3a'
                                     : state === 'done'   ? col
                                     : bg;
            if (state !== 'locked') {
                circle.href = 'index.html?level=' + (lvl+1) + '&topic=' + encodeURIComponent(nd[2]);
            }

            const icon = document.createElement('span');
            icon.className = 'nd-label-icon';
            icon.textContent = nd[0];

            const badge = document.createElement('div');
            badge.className = 'nd-done-badge';
            badge.textContent = '✓';

            circle.appendChild(icon);
            circle.appendChild(badge);

            const label = document.createElement('div');
            label.className = 'nd-label-below';
            label.textContent = nd[1];

            outer.appendChild(circle);
            outer.appendChild(label);
            wrap.appendChild(outer);
        });
    }
}

function init() {
    const acc = currentAccount();
    const xp  = getXp();

    renderTopBar(acc);

    const hero = document.getElementById('guestHero');
    const map  = document.getElementById('mapWrap');

    if (!acc) {
        hero.style.display = 'block';
        map.style.opacity  = '.35';
        map.style.pointerEvents = 'none';
    } else {
        hero.style.display = 'none';
        map.style.opacity  = '1';
        map.style.pointerEvents = 'auto';
    }

    renderMap(xp);
}

init();
</script>
