<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="./modules/i18n.js?v=3.1.0"></script>

<link rel="icon" href="../assets/app/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/app/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/app/icon-180.png">

<title data-en="Practice | Second-Order Resonance">Üben | Second-Order Resonance</title>
<meta name="description" content="Mathe und Physik üben mit Aufgaben, die sich deinem Stand anpassen: Tipps, Lösungswege, XP, Sterne und Abzeichen. Von Klasse 1 bis zum Master." data-en-content="Practise maths and physics with exercises that adapt to your level: hints, worked solutions, XP, stars and badges. From grade 1 to master's level.">
<meta name="theme-color" content="#0a0e1c">
<link rel="stylesheet" href="./vendor/fonts/fonts.css?v=3.0.0">
<link rel="stylesheet" href="./modules/sor-ui.css?v=3.1.0">
<link rel="stylesheet" href="./modules/sor-math.css?v=3.1.0">
<style>
  .hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.6rem;align-items:center;margin-bottom:1.8rem}
  .hero h1{font-size:clamp(2.1rem,4.4vw,3.2rem);margin:0.5rem 0 0.6rem}
  .hero h1 .serif{color:var(--accent);font-size:1.12em}
  .hero p{color:var(--soft);font-size:1.05rem;max-width:34rem}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.8rem}
  .stat{display:flex;gap:0.9rem;align-items:center;padding:1rem 1.1rem}
  .stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.35rem;line-height:1.1}
  .stat small{color:var(--muted);font-size:0.8rem}
  .ring{flex:0 0 auto;width:52px;height:52px}
  .ring circle{fill:none;stroke-width:6;stroke-linecap:round}
  .ico{flex:0 0 auto;width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:rgba(255,255,255,0.05);border:1px solid var(--line)}
  h2.sec{font-size:1.25rem;margin:2rem 0 0.9rem;display:flex;align-items:center;gap:0.7rem}
  .reco{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0.9rem}
  .reco a{display:flex;flex-direction:column;gap:0.4rem;text-decoration:none;padding:1.1rem 1.2rem;border-radius:18px;border:1px solid var(--line);background:linear-gradient(140deg,rgba(245,197,24,0.07),rgba(255,255,255,0.02));transition:transform .2s,border-color .2s}
  .reco a:hover{transform:translateY(-3px);border-color:rgba(245,197,24,0.5)}
  .reco .why{font-family:'IBM Plex Mono',monospace;font-size:0.64rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal)}
  .reco strong{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;line-height:1.3}
  .stages{display:flex;gap:0.4rem;overflow-x:auto;padding:0.2rem 0 0.7rem;scrollbar-width:thin}
  .stage{flex:0 0 auto;min-width:44px;height:42px;padding:0 0.75rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;transition:all .2s}
  .stage:hover{color:var(--text);border-color:var(--line2)}
  .stage.on{color:#0a0e1c;background:var(--accent);border-color:var(--accent)}
  .stage.uni{font-family:'IBM Plex Mono',monospace;font-size:0.78rem}
  .subj{display:inline-flex;gap:0.3rem;padding:0.3rem;border-radius:16px;border:1px solid var(--line);background:var(--card);margin-bottom:0.9rem;flex-wrap:wrap}
  .subj button{display:inline-flex;align-items:center;gap:0.5rem;padding:0.55rem 1rem;border-radius:12px;border:0;background:none;color:var(--muted);font:600 0.95rem 'Space Grotesk',sans-serif;cursor:pointer;transition:all .2s}
  .subj button i{font-style:normal;font-size:1.05rem}
  .subj button:hover{color:var(--text)}
  .subj button[aria-pressed="true"]{background:rgba(245,197,24,0.14);color:var(--accent)}
  .stage.course{font-size:0.82rem}
  .sep{flex:0 0 1px;height:26px;background:var(--line2);margin:8px 0.3rem}
  .tlist{display:grid;gap:0.55rem}
  .trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1rem;align-items:center;padding:0.85rem 1.1rem;border-radius:16px;border:1px solid var(--line);background:var(--card)}
  .trow small{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted)}
  .trow strong{font-weight:600}
  .stagehead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:0.9rem}

  /* Sitzung */
  .sess{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.3rem;align-items:start}
  .sess.solo{grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}
  .sbar{display:flex;align-items:center;gap:1rem;margin-bottom:1.1rem}
  .dots{display:flex;gap:0.35rem;flex:1}
  .dots i{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,0.09);transition:background .3s}
  .dots i.ok{background:var(--teal)} .dots i.bad{background:var(--red)} .dots i.now{background:rgba(245,197,24,0.55)}
  .quit{color:var(--muted);text-decoration:none;font-size:1.3rem;line-height:1;padding:0.2rem 0.5rem;border-radius:8px;background:none;border:none;cursor:pointer}
  .qcard{padding:1.7rem;position:relative;overflow:hidden}
  .qmeta{display:flex;justify-content:space-between;gap:0.8rem;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
  .diff{display:inline-flex;gap:3px;vertical-align:middle;margin-left:0.4rem}
  .diff i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15)}
  .diff i.on{background:var(--accent)}
  .qtext{font-size:1.18rem;line-height:1.75}
  .qtext .mth{font-size:1.22em}
  .answer{margin-top:1.4rem;display:grid;gap:0.7rem}
  .ansrow{display:flex;align-items:center;gap:0.6rem}
  .ansrow label{min-width:7.5rem;color:var(--soft);font-size:0.95rem}
  .ansrow .input{font-size:1.15rem;font-family:'IBM Plex Mono',monospace;max-width:16rem}
  .ansrow .unit{color:var(--muted)}
  .opts{display:grid;gap:0.6rem}
  .opt{display:flex;gap:0.8rem;align-items:center;text-align:left;padding:0.85rem 1rem;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,0.03);cursor:pointer;font-size:1.05rem;transition:border-color .15s,background .15s,transform .15s}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
  .opt kbd{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted)}
  .opt.right{border-color:var(--teal);background:rgba(53,224,196,0.1)}
  .opt.wrong{border-color:var(--red);background:rgba(233,69,96,0.08);opacity:0.7}
  .opt:disabled{cursor:default}
  .actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1.3rem;align-items:center}
  .actions .spacer{flex:1}
  .hint{margin-top:1rem;border-left:2px solid var(--accent);background:rgba(245,197,24,0.06);border-radius:0 12px 12px 0;padding:0.7rem 0.95rem;color:#e9dfb9}
  .fb{margin-top:1.1rem;border-radius:16px;padding:1rem 1.1rem;border:1px solid}
  .fb.ok{border-color:rgba(53,224,196,0.45);background:rgba(53,224,196,0.08)}
  .fb.no{border-color:rgba(233,69,96,0.45);background:rgba(233,69,96,0.07)}
  .fb.try{border-color:rgba(245,197,24,0.45);background:rgba(245,197,24,0.06)}
  .fb h3{font-size:1.05rem;display:flex;gap:0.5rem;align-items:center;justify-content:space-between}
  .fb .gain{font-family:'Space Grotesk',sans-serif;color:var(--accent)}
  .steps{margin:0.7rem 0 0 1.2rem;display:grid;gap:0.35rem;color:#d7dcec}
  .steps li{padding-left:0.2rem}
  details.way summary{cursor:pointer;color:var(--soft);margin-top:0.6rem;font-size:0.92rem}
  .shake{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .explain{padding:0;overflow:hidden;position:sticky;top:86px}
  .explain .vis{background:#070a14;padding:0.8rem 1rem 0.3rem;border-bottom:1px solid rgba(255,255,255,0.05)}
  .explain .body{padding:1.1rem 1.2rem 1.2rem;display:grid;gap:0.65rem}
  .explain h3{font-size:1.05rem}
  .explain p{color:var(--soft);font-size:0.94rem}
  .formula{font-family:'Instrument Serif',Georgia,serif;font-size:1.18rem;color:#f3efe6;background:rgba(255,255,255,0.03);border-left:2px solid var(--accent);border-radius:10px;padding:0.5rem 0.8rem;display:grid;gap:0.1rem}
  .formula sup,.formula sub{font-size:0.65em}
  .side-stats{display:flex;gap:0.5rem;flex-wrap:wrap}

  /* Ergebnis */
  .result{max-width:720px;margin:0 auto;text-align:center;padding:2.2rem 1.6rem}
  .result h2{font-size:clamp(1.8rem,4vw,2.6rem);margin:0.4rem 0 0.3rem}
  .rnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.8rem;margin:1.5rem 0}
  .rnums div{padding:1rem 0.6rem;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,0.03)}
  .rnums b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.7rem}
  .rnums small{color:var(--muted)}
  .badges{display:flex;gap:0.7rem;flex-wrap:wrap;justify-content:center;margin:1rem 0}
  .badge{display:flex;gap:0.6rem;align-items:center;padding:0.6rem 0.9rem;border-radius:14px;border:1px solid rgba(245,197,24,0.4);background:rgba(245,197,24,0.07);text-align:left}
  .badge i{font-size:1.5rem;font-style:normal}
  .badge small{display:block;color:var(--muted);font-size:0.78rem}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

  @media (max-width:900px){
    .hero,.sess{grid-template-columns:minmax(0,1fr)}
    .explain{position:static}
    .trow{grid-template-columns:minmax(0,1fr) auto}
    .trow .stars{grid-column:1;grid-row:2}
    .ansrow{flex-wrap:wrap}
    .ansrow label{min-width:100%}
    .qcard{padding:1.2rem}
    .qtext{font-size:1.08rem}
  }
</style>
</head>
<body>
<div id="sorHeader" data-page="ueben"></div>

<main class="wrap">
  <!-- Übersicht -->
  <section id="hub">
    <div class="hero">
      <div>
        <div class="kicker" data-en="Practice centre">Übungszentrum</div>
        <h1 id="hello" data-en="Ready for <span class=&quot;serif&quot;>today</span>?">Bereit für <span class="serif">heute</span>?</h1>
        <p data-en="The exercises adapt to your level. Every exercise has a hint and a worked solution, and every correct answer earns XP.">Die Aufgaben passen sich deinem Stand an. Jede Aufgabe hat einen Tipp und einen Lösungsweg, und für jede richtige Antwort gibt es XP.</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div id="assignWrap" hidden>
      <h2 class="sec" data-en="From your teacher">Von deiner Lehrkraft</h2>
      <div class="reco" id="assign"></div>
    </div>

    <h2 class="sec" data-en="Keep practising">Weiter üben</h2>
    <div class="reco" id="reco"></div>

    <h2 class="sec" data-en="All topics">Alle Themen</h2>
    <div class="subj" id="subjects" role="group" aria-label="Fach" data-en-aria-label="Subject"></div>
    <div class="stages" id="stages" role="group" aria-label="Klasse, Studienphase oder Kurs" data-en-aria-label="Grade, study phase or course"></div>
    <div class="stagehead">
      <p class="muted" id="stageInfo"></p>
      <a class="btn btn-ghost btn-sm" id="mixBtn" href="#" data-en="Start a mixed round →">Gemischte Runde starten →</a>
    </div>
    <div class="tlist" id="topics"></div>
  </section>

  <!-- Sitzung -->
  <section id="session" hidden>
    <div class="sbar">
      <button class="quit" id="quit" type="button" aria-label="Übung beenden" data-en-aria-label="End practice">✕</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="sor-pill fire" id="combo" hidden></span>
      <span class="sor-pill xp" id="sessXp">+0 XP</span>
    </div>
    <div class="sess" id="sessGrid">
      <div class="card qcard" id="qcard">
        <div class="qmeta"><span id="qTopic"></span><span><span data-en="Exercise">Aufgabe</span> <span id="qNo"></span><span class="diff" id="qDiff" title="Schwierigkeit" data-en-title="Difficulty"></span></span></div>
        <div class="qtext" id="qText" aria-live="polite"></div>
        <form class="answer" id="answer" autocomplete="off"></form>
        <div class="hint" id="hint" hidden></div>
        <div id="feedback" aria-live="polite"></div>
        <div class="actions" id="actions"></div>
      </div>
      <aside class="card explain" id="explain" hidden></aside>
    </div>
  </section>

  <!-- Ergebnis -->
  <section id="result" hidden>
    <div class="card result pop" id="resultCard"></div>
  </section>
</main>
<canvas id="confetti" hidden></canvas>

<script>
(function () {
    "use strict";
    if (window.SOR_I18N) SOR_I18N.apply();
    var E = window.SOR_EX, CRS = window.SOR_COURSES, COV = window.SOR_COVERAGE, REW = window.SOR_REWARDS, NAV = window.SOR_NAV, VIS = window.SOR_VISUALS, esc = NAV.esc;
    var st = document.createElement("style"); st.textContent = E.css; document.head.appendChild(st);
    var $ = function (id) { return document.getElementById(id); };
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- Themen und Stufen ----------
    var TOPIC = {};
    COV.school.concat(COV.engineering).concat(CRS.lessons).forEach(function (e) { TOPIC[e.id] = e; });
    var HAS = E.topics();
    var STAGES = [], g;
    for (g = 1; g <= 12; g += 1) STAGES.push({ key: "k" + g, label: String(g), title: $t("Klasse ", "Grade ") + g, grade: g, subject: "mathe" });
    var bands = [];
    COV.engineering.forEach(function (e) { if (bands.indexOf(e.band) === -1) bands.push(e.band); });
    bands.forEach(function (b, i) { STAGES.push({ key: "e" + i, label: [$t("B 1–2", "BSc 1–2"), $t("B 3–4", "BSc 3–4"), $t("B Vert.", "BSc adv."), "Master"][i] || b, title: $t("Studium · ", "University · ") + b, band: b, subject: "mathe" }); });
    CRS.courses.forEach(function (c) { STAGES.push({ key: "c-" + c.id, label: c.short, title: c.title, course: c.id, subject: c.subject }); });
    function stageTopics(s) {
        var list = s.grade ? COV.school.filter(function (e) { return e.grades[0] <= s.grade && s.grade <= e.grades[1]; }) : s.course ? CRS.course(s.course).lessons : COV.engineering.filter(function (e) { return e.band === s.band; });
        return list.filter(function (e) { return HAS[e.id]; });
    }
    function stageByKey(k) { return STAGES.filter(function (s) { return s.key === k; })[0]; }
    function subjectStages(sub) { return STAGES.filter(function (s) { return s.subject === sub; }); }
    function sessionHref(topicId, back) { return "ueben.html?thema=" + encodeURIComponent(topicId) + (back ? "&zurueck=" + encodeURIComponent(back) : ""); }

    var params = new URLSearchParams(location.search);
    var back = params.get("zurueck") || "";
    if (!/^[a-z0-9_-]+\.html(\?[^#\s]*)?(#[\w-]*)?$/i.test(back)) back = "";

    // ---------- Übersicht ----------
    function ringSvg(frac, color) {
        var c = 2 * Math.PI * 21, f = Math.max(0, Math.min(1, frac));
        return '<svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" stroke="rgba(255,255,255,0.09)"/><circle cx="26" cy="26" r="21" stroke="' + color + '" stroke-dasharray="' + (c * f).toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 26 26)"/></svg>';
    }
    function renderHub() {
        var acc = SOR.accounts.current(), p = REW.profile(), lv = REW.level(p.xp), today = (p.daily[SOR.today()] || { xp: 0 }).xp;
        var today2 = $t("bereit für <span class=\"serif\">heute</span>?", "ready for <span class=\"serif\">today</span>?");
        $("hello").innerHTML = acc ? $t("Hallo ", "Hi ") + esc(acc.displayName.split(" ")[0]) + ", " + today2 : today2.charAt(0).toUpperCase() + today2.slice(1);
        $("stats").innerHTML =
            '<div class="card stat">' + ringSvg(today / p.goal, "#35e0c4") + "<div><b>" + today + " / " + p.goal + " XP</b><small>" + $t("Tagesziel", "Daily goal") + (today >= p.goal ? $t(" erreicht ✓", " reached ✓") : "") + "</small></div></div>" +
            '<div class="card stat">' + ringSvg(lv.progress, "#f5c518") + "<div><b>" + $t("Stufe ", "Level ") + lv.level + "</b><small>" + lv.title + $t(" · noch ", " · ") + (lv.need - lv.into) + $t(" XP", " XP to go") + "</small></div></div>" +
            '<div class="card stat"><div class="ico">🔥</div><div><b>' + p.streak.count + (p.streak.count === 1 ? $t(" Tag", " day") : $t(" Tage", " days")) + "</b><small>" + $t("Lernserie · Rekord ", "Streak · best ") + (p.streak.best || 0) + "</small></div></div>" +
            '<div class="card stat"><div class="ico">⭐</div><div><b>' + REW.totalStars(p) + $t(" Sterne", " stars") + "</b><small>" + Object.keys(p.badges).length + $t(" von ", " of ") + REW.BADGES.length + $t(" Abzeichen", " badges") + "</small></div></div>";

        // Aufträge
        var asg = acc ? SOR.school.assignmentsFor(acc.id).filter(function (a) { return TOPIC[a.topicId] && HAS[a.topicId]; }) : [];
        $("assignWrap").hidden = !asg.length;
        $("assign").innerHTML = asg.map(function (a) {
            var m = p.mastery[a.topicId], s = m ? REW.stars(m.score) : 0;
            return '<a href="' + sessionHref(a.topicId) + '"><span class="why">' + esc(a.className) + (a.due ? $t(" · bis ", " · due ") + esc(a.due.split("-").reverse().join(".")) : "") + "</span><strong>" + esc(TOPIC[a.topicId].topic) + "</strong>" + NAV.stars(s) + "</a>";
        }).join("");

        // Empfehlungen
        var stage = currentStage(), recs = [], seen = {};

    var fach = params.get("fach");

    }

    $("stages").addEventListener("click", function (ev) {

        if (fach === "mathe" && !(keep && keep.subject === "mathe")) keep = stageByKey("k5");
        store("sor-last-stage", keep.key);
        if (history.replaceState) history.replaceState(null, "", "ueben.html?fach=" + fach);
        renderHub();
    });

    // ---------- Sitzung ----------
    var S = null;
    function startSession(topics, label, total) {
        S = { topics: topics, label: label, total: total, idx: 0, correct: 0, xp: 0, d: {}, run: {}, lastGen: {}, results: [], badges: [], levelUp: null, starUps: [], q: null, tries: 0, hintUsed: false, done: false, mix: topics.length > 1 };
        var p = REW.profile();

        $("hub").hidden = true; $("result").hidden = true; $("session").hidden = false;

        renderExplain(topics.length === 1 ? topics[0] : null);
        nextQuestion();
        window.scrollTo(0, 0);
    }
    function renderExplain(topicId) {

        if (!e) { box.hidden = true; $("sessGrid").classList.add("solo"); return; }
        $("sessGrid").classList.remove("solo"); box.hidden = false;
        var formulas = e.formula ? (Array.isArray(e.formula) ? e.formula : [e.formula]).map(function (f) { return "<span>" + f + "</span>"; }).join("") : "";
        box.innerHTML = (e.visual ? '<div class="vis" id="exVis"></div>' : "") + '<div class="body"><div class="kicker">' + (e.course ? esc(e.band) + " · " + $t("Lektion ", "Lesson ") + e.n : $t("Kurz erklärt", "In short")) + "</div><h3>" + esc(e.topic) + "</h3>" +
            (e.text ? "<p>" + e.text + "</p>" : '<p>' + esc(e.area) + " · " + esc(e.band) + "</p>") + (formulas ? '<div class="formula">' + formulas + "</div>" : "") +
            '<div class="side-stats"><span class="chip" id="exStars">' + NAV.stars(m ? REW.stars(m.score) : 0) + '</span><span class="chip">' + HAS[topicId] * 3 + $t(" Aufgabenformen", " exercise types") + "</span>" + (e.course ? '<a class="chip" href="kurs.html?k=' + e.course + "#" + e.id + '">' + $t("Zum Kurs", "Course") + " →</a>" : "") + "</div></div>";
        if (e.visual && VIS) VIS.mount($("exVis"), e.visual);
    }
    function renderDots() {
        var h = "", i;
        for (i = 0; i < S.total; i += 1) h += '<i class="' + (i < S.results.length ? (S.results[i] ? "ok" : "bad") : (i === S.idx ? "now" : "")) + '"></i>';
        $("dots").innerHTML = h;
        $("sessXp").textContent = "+" + S.xp + " XP";
    }
    function nextQuestion() {
        var topic = S.topics[S.idx % S.topics.length], gens = E.byTopic(topic), pick = gens[Math.floor(Math.random() * gens.length)], guard = 0;
        while (gens.length > 1 && pick.id === S.lastGen[topic] && guard < 8) { pick = gens[Math.floor(Math.random() * gens.length)]; guard += 1; }
        S.lastGen[topic] = pick.id;
        S.q = E.generate(pick.id, { difficulty: S.d[topic] });
        S.tries = 0; S.hintUsed = false; S.done = false;
        $("qTopic").textContent = TOPIC[topic] ? TOPIC[topic].topic : pick.title;
        $("qNo").textContent = (S.idx + 1) + " / " + S.total;
        $("qDiff").innerHTML = [1, 2, 3].map(function (i) { return '<i class="' + (i <= S.q.difficulty ? "on" : "") + '"></i>'; }).join("");
        $("qText").innerHTML = S.q.q;
        $("hint").hidden = true; $("hint").innerHTML = "";
        $("feedback").innerHTML = "";
        renderAnswer(); renderActions(); renderDots();
        $("qcard").classList.remove("pop"); void $("qcard").offsetWidth; $("qcard").classList.add("pop");
        var first = $("answer").querySelector("input"); if (first) first.focus({ preventScroll: true });
    }
    function inputHtml(spec, id) {
        var ph = spec.type === "frac" ? $t("z. B. 3/4", "e.g. 3/4") : (spec.dec !== undefined ? $t("z. B. 3,14", "e.g. 3.14") : $t("Zahl", "Number"));
        return '<input class="input" id="' + id + '" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="' + ph + '" aria-label="' + $t("Antwort", "Answer") + '">' + (spec.unit ? '<span class="unit">' + esc(spec.unit) + "</span>" : "");
    }
    function renderAnswer() {
        var a = S.q.a, f = $("answer");
        if (a.type === "choice") f.innerHTML = '<div class="opts">' + a.options.map(function (o, i) { return '<button type="button" class="opt" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd><span>" + o + "</span></button>"; }).join("") + "</div>";
        else if (a.type === "multi") f.innerHTML = a.fields.map(function (fl, i) { return '<div class="ansrow"><label for="ans' + i + '">' + fl.l + "</label>" + inputHtml(fl.a, "ans" + i) + "</div>"; }).join("");
        else f.innerHTML = '<div class="ansrow">' + inputHtml(a, "ans0") + "</div>";
    }
    function renderActions() {
        var a = S.q.a, box = $("actions");
        if (S.done) {
            box.innerHTML = '<span class="spacer"></span><button class="btn btn-primary" id="nextBtn" type="button">' + (S.idx + 1 >= S.total ? $t("Auswertung ansehen →", "See results →") : $t("Weiter →", "Next →")) + "</button>";

        }

    function finish(ok, skipped) {

        if (q.a.type === "choice") { var right = $("answer").querySelector('[data-i="' + q.a.v + '"]'); if (right) right.classList.add("right"); }

        $("feedback").innerHTML = ok
            ? '<div class="fb ok pop"><h3><span>✓ ' + praise + (r.combo >= 3 ? " " + r.combo + $t(" in Folge.", " in a row.") : "") + '</span><span class="gain">+' + r.xp + " XP</span></h3><details class=\"way\"><summary>" + $t("Lösungsweg ansehen", "Show worked solution") + "</summary>" + steps + "</details></div>"
            : '<div class="fb no pop"><h3><span>' + (skipped ? $t("Lösung", "Solution") : $t("Das stimmt leider nicht.", "Sorry, that is not right.")) + '</span></h3><p style="margin-top:0.4rem">' + $t("Richtig ist: ", "Correct answer: ") + '<strong class="mth">' + E.show(q.a) + "</strong></p>" + steps + "</div>";

        else if (r.newBadges.length) NAV.toast("<span style=\"font-size:1.4rem\">" + r.newBadges[0].icon + "</span><span><strong>" + $t("Neues Abzeichen:", "New badge:") + "</strong> " + esc(r.newBadges[0].title) + "</span>");

        S.badges = S.badges.concat(r.newBadges);

    function advance() { S.idx += 1; if (S.idx >= S.total) showResult(); else nextQuestion(); }

    function showResult() {
        var fin = REW.finishSession({ total: S.total, correct: S.correct });
        S.badges = S.badges.concat(fin.newBadges);
        var p = REW.profile(), lv = REW.level(p.xp), pct = Math.round(S.correct / S.total * 100), again = S.mix ? location.search : "?thema=" + encodeURIComponent(S.topics[0]) + (back ? "&zurueck=" + encodeURIComponent(back) : "");
        var head = pct === 100 ? $t("Fehlerfrei!", "Flawless!") : pct >= 75 ? $t("Stark gemacht!", "Well done!") : pct >= 50 ? $t("Gut geübt!", "Good practice!") : $t("Dranbleiben lohnt sich", "Keep at it, it pays off");
        var uniq = S.topics.filter(function (t, i, arr) { return arr.indexOf(t) === i && TOPIC[t]; }).slice(0, 6);
        $("session").hidden = true; $("result").hidden = false;
        $("resultCard").innerHTML = '<div class="kicker">' + esc(S.label) + "</div><h2>" + head + "</h2><p class=\"muted\">" + S.correct + $t(" von ", " of ") + S.total + $t(" Aufgaben richtig", " exercises correct") + "</p>" +
            '<div class="rnums"><div><b>' + pct + ' %</b><small>' + $t("Trefferquote", "Accuracy") + '</small></div><div><b style="color:var(--accent)">+' + S.xp + "</b><small>" + $t("XP verdient", "XP earned") + "</small></div><div><b>🔥 " + p.streak.count + "</b><small>" + $t("Tage Lernserie", "day streak") + "</small></div></div>" +
            '<div style="text-align:left;margin:0 auto 1.2rem;max-width:460px"><div style="display:flex;justify-content:space-between;font-size:0.86rem;color:var(--muted);margin-bottom:0.35rem"><span>' + $t("Stufe ", "Level ") + lv.level + " · " + lv.title + "</span><span>" + lv.into + " / " + lv.need + ' XP</span></div><div class="bar"><span style="width:' + Math.round(lv.progress * 100) + '%"></span></div></div>' +
            '<div class="tlist" style="max-width:460px;margin:0 auto 1rem;text-align:left">' + uniq.map(function (t) { var m = p.mastery[t]; return '<div class="trow" style="grid-template-columns:minmax(0,1fr) auto"><strong>' + esc(TOPIC[t].topic) + "</strong>" + NAV.stars(m ? REW.stars(m.score) : 0) + "</div>"; }).join("") + "</div>" +
            (S.badges.length ? '<div class="badges">' + S.badges.map(function (b) { return '<div class="badge pop"><i>' + b.icon + "</i><div><strong>" + esc(b.title) + "</strong><small>" + esc(b.text) + "</small></div></div>"; }).join("") + "</div>" : "") +
            '<div class="actions" style="justify-content:center"><a class="btn btn-primary" href="ueben.html' + again + '">' + $t("Noch eine Runde", "One more round") + "</a>" + (back ? '<a class="btn btn-ghost" href="' + esc(back) + '">' + $t("Zurück zur Übersicht", "Back to overview") + "</a>" : "") + '<a class="btn btn-ghost" href="ueben.html">' + $t("Alle Themen", "All topics") + "</a></div>" +
            (SOR.accounts.current() ? "" : '<p class="dim" style="margin-top:1.2rem;font-size:0.88rem">' + $t('Dein Fortschritt liegt in diesem Browser. <a href="konto.html">Mit einem Konto</a> behältst du ihn auch nach einem Gerätewechsel im Blick, sobald die Cloud-Anbindung aktiv ist.', 'Your progress is stored in this browser. <a href="konto.html">With an account</a> you can keep track of it across devices once cloud sync is active.') + "</p>");
        NAV.refresh(); window.scrollTo(0, 0);
        if (pct >= 75 && !reduce) confetti();
    }

    function confetti() {
        var c = $("confetti"), ctx = c.getContext("2d"), W = c.width = window.innerWidth, H = c.height = window.innerHeight, cols = ["#f5c518", "#35e0c4", "#e94560", "#60a5fa", "#8b5cf6"], parts = [], i, t0 = performance.now();
        for (i = 0; i < 110; i += 1) parts.push({ x: W / 2 + (Math.random() - 0.5) * 200, y: H * 0.35, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 3, s: 5 + Math.random() * 6, r: Math.random() * 6, c: cols[i % cols.length] });
        c.hidden = false;

            parts.forEach(function (p) { p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.r += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - age / 2200); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });

    }

    // ---------- Eingaben ----------
    $("answer").addEventListener("submit", function (ev) { ev.preventDefault(); submitInputs(); });
    $("answer").addEventListener("click", function (ev) {
        var b = ev.target.closest(".opt"); if (!b || S.done || b.disabled) return;
        judge(Number(b.getAttribute("data-i")) === S.q.a.v, b);
    });
    document.addEventListener("keydown", function (ev) {
        if (!S || $("session").hidden) return;
        if (ev.key === "Enter") { if (S.done) { ev.preventDefault(); advance(); } else if (S.q.a.type !== "choice" && ev.target.tagName === "INPUT") { ev.preventDefault(); submitInputs(); } return; }
        if (!S.done && S.q.a.type === "choice" && /^[1-4]$/.test(ev.key)) { var b = $("answer").querySelector('[data-i="' + (Number(ev.key) - 1) + '"]'); if (b && !b.disabled) b.click(); }
    });
    $("quit").addEventListener("click", function () {
        if (S && S.results.length && !window.confirm($t("Übung wirklich beenden? Deine bisherigen XP bleiben erhalten.", "End this practice? The XP you earned so far is kept."))) return;

    });

    // Testzugang für tools/ (nur lokal): liefert die aktuelle Antwortspezifikation
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__SOR_DEBUG_Q = function () { return S && S.q ? S.q.a : null; };

    // ---------- Start ----------
    var thema = params.get("thema"), mix = params.get("mix");
    if (thema && TOPIC[thema] && HAS[thema]) startSession([thema], TOPIC[thema].topic, 8);
    else if (mix && stageByKey(mix) && stageTopics(stageByKey(mix)).length) {
        var ids = stageTopics(stageByKey(mix)).map(function (e) { return e.id; }), i, j, t;

})();
