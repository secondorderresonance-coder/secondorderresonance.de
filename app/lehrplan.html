<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrplan Klasse 1–12 | Second-Order Resonance</title>
    <meta name="description" content="Curriculum-Uebersicht Klasse 1–12: Alle Schulmathematik-Themen mit direktem Link ins SOR-Lernarchiv.">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --bg:      #1a1a2e;
            --panel:   #16213e;
            --panel2:  #0f172a;
            --accent:  #e94560;
            --text:    #eef;
            --muted:   #99a;
            --gold:    #f5c518;
            --line:    rgba(255,255,255,0.1);
            --l1:      #22c55e;
            --l2:      #eab308;
            --l3:      #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(233,69,96,0.12), transparent 26rem),
                linear-gradient(180deg, #1a1a2e 0%, #10182e 55%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* ── topbar ── */
        .topbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(22,33,62,0.94);
            border-bottom: 1px solid rgba(233,69,96,0.25);
            backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1.2rem; gap: 0.8rem;
        }
        .logo { font-weight: 900; color: var(--gold); letter-spacing: 0.02em; }
        .logo span { color: var(--accent); }
        .top-nav { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .nav-pill {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: var(--text); border-radius: 999px;
            padding: 0.38rem 0.75rem; font-size: 0.8rem; font-weight: 700;
        }
        .nav-pill:hover { border-color: rgba(233,69,96,0.55); }

        /* ── layout ── */
        .shell { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }

        /* ── page header ── */
        .page-head { margin-bottom: 2rem; }
        .page-head h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 900; }
        .page-head h1 span { color: var(--accent); }
        .page-head p { color: var(--muted); margin-top: 0.5rem; max-width: 62ch; }

        /* ── group filter ── */
        .filter-row {
            display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.8rem;
        }
        .filter-btn {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
            color: var(--muted); border-radius: 999px;
            padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: all 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            border-color: var(--accent); color: var(--text);
            background: rgba(233,69,96,0.12);
        }
        .filter-btn[data-group="Grundschule"].active  { border-color: var(--l1); background: rgba(34,197,94,0.12); color: var(--l1); }
        .filter-btn[data-group="Mittelstufe"].active  { border-color: var(--l2); background: rgba(234,179,8,0.12);  color: var(--l2); }
        .filter-btn[data-group="Oberstufe"].active    { border-color: var(--l3); background: rgba(249,115,22,0.12); color: var(--l3); }

        /* ── grade cards grid ── */
        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.1rem;
        }
        .grade-card {
            background: rgba(22,33,62,0.82);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .grade-card:hover { border-color: rgba(233,69,96,0.4); }
        .grade-card.hidden { display: none; }

        .card-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .grade-label { font-weight: 900; font-size: 1rem; }
        .level-badge {
            font-size: 0.72rem; font-weight: 800;
            padding: 0.25rem 0.6rem; border-radius: 999px;
        }
        .level-badge.l1 { background: rgba(34,197,94,0.18);  color: var(--l1); border: 1px solid rgba(34,197,94,0.35); }
        .level-badge.l2 { background: rgba(234,179,8,0.18);   color: var(--l2); border: 1px solid rgba(234,179,8,0.35); }
        .level-badge.l3 { background: rgba(249,115,22,0.18);  color: var(--l3); border: 1px solid rgba(249,115,22,0.35); }

        .card-topics { padding: 0.6rem 0.5rem; }
        .topic-row {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.38rem 0.5rem; border-radius: 8px;
            font-size: 0.84rem; color: var(--text);
            transition: background 0.12s;
        }
        .topic-row:hover { background: rgba(255,255,255,0.05); }
        .topic-dot {
            width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
        }
        .topic-row .topic-title { flex: 1; }
        .topic-row .archive-link {
            font-size: 0.72rem; color: var(--muted); font-weight: 700;
            padding: 0.15rem 0.45rem; border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }
        .topic-row:hover .archive-link { border-color: rgba(233,69,96,0.4); color: var(--accent); }

        /* ── legend ── */
        .legend {
            display: flex; flex-wrap: wrap; gap: 1rem;
            margin-bottom: 1.5rem; font-size: 0.82rem;
        }
        .legend-item { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        @media (max-width: 480px) {
            .grades-grid { grid-template-columns: 1fr; }
            .top-nav { gap: 0.4rem; }
            .nav-pill { font-size: 0.74rem; padding: 0.3rem 0.55rem; }
        }
    </style>
</head>
<body>

<nav class="topbar">
    <a class="logo" href="../index.html">Second<span>Order</span>Resonance</a>
    <div class="top-nav">
        <a class="nav-pill" href="lernpfad.html">🗺 Lernpfad</a>
        <a class="nav-pill" href="lernarchiv.html">📚 Archiv</a>
        <a class="nav-pill" href="index.html">⚡ Üben</a>
        <a class="nav-pill" href="../index.html">← Start</a>
    </div>
</nav>

<div class="shell">
    <header class="page-head">
        <h1>Lehrplan <span>Klasse 1–12</span></h1>
        <p>Alle Themen der Schulmathematik – von der Grundschule bis zum Abitur – mit direktem Link ins SOR-Lernarchiv.</p>
    </header>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--l1)"></div> L1 Grundlagen (Klasse 1–6)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--l2)"></div> L2 Aufbauwissen (Klasse 7–10)</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--l3)"></div> L3 Vertiefung (Klasse 11–12)</div>
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div class="grades-grid" id="gradesGrid"></div>
</div>

<script src="data/curriculum-matrix.js"></script>
<script>
(function () {
    const ARCHIVE = "lernarchiv.html";
    const data = window.SOR_CURRICULUM;
    const levelMeta = data.levelMeta;

    const archiveUrl = (level, sublevel, topic) =>
        `${ARCHIVE}?level=${encodeURIComponent(level)}&sublevel=${encodeURIComponent(sublevel)}&topic=${encodeURIComponent(topic)}`;

    const dotColor = (level) => levelMeta[level]?.color ?? "#aaa";
    const badgeClass = (level) => ({ "1": "l1", "2": "l2", "3": "l3" }[level] ?? "");

    // ── filter buttons ──
    const filterRow = document.getElementById("filterRow");
    let activeGroup = "all";

    const groups = ["all", ...data.groups];
    const groupLabels = { all: "Alle Klassen", Grundschule: "Grundschule (1–4)", Mittelstufe: "Mittelstufe (5–10)", Oberstufe: "Oberstufe (11–12)" };

    groups.forEach(g => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (g === "all" ? " active" : "");
        btn.textContent = groupLabels[g] ?? g;
        if (g !== "all") btn.dataset.group = g;
        btn.addEventListener("click", () => {
            activeGroup = g;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            applyFilter();
        });
        filterRow.appendChild(btn);
    });

    // ── render grade cards ──
    const grid = document.getElementById("gradesGrid");

    data.grades.forEach(grade => {
        const meta = levelMeta[grade.sorLevel];
        const color = dotColor(grade.sorLevel);

        const card = document.createElement("div");
        card.className = "grade-card";
        card.dataset.group = grade.group;

        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = `
            <span class="grade-label">${grade.label}</span>
            <span class="level-badge ${badgeClass(grade.sorLevel)}">${meta.code} · ${meta.label}</span>
        `;
        card.appendChild(head);

        const topics = document.createElement("div");
        topics.className = "card-topics";

        grade.topics.forEach(t => {
            const row = document.createElement("a");
            row.className = "topic-row";
            row.href = archiveUrl(grade.sorLevel, t.sublevel, t.topic);
            row.innerHTML = `
                <div class="topic-dot" style="background:${color}"></div>
                <span class="topic-title">${t.title}</span>
                <span class="archive-link">${t.sublevel}</span>
            `;
            topics.appendChild(row);
        });

        card.appendChild(topics);
        grid.appendChild(card);
    });

    function applyFilter() {
        document.querySelectorAll(".grade-card").forEach(card => {
            card.classList.toggle("hidden", activeGroup !== "all" && card.dataset.group !== activeGroup);
        });
    }
})();
</script>
</body>
</html>
