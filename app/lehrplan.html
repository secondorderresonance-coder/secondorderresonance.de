<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrplan Klasse 1-12 | Second-Order Resonance</title>
    <meta name="description" content="Curriculum-Matrix: Alle Schulthemen von Klasse 1 bis 12, zugeordnet zu den L1-L3 Archivbereichen von Second-Order Resonance.">
    <meta name="theme-color" content="#1a1a2e">
    <script src="data/curriculum-matrix.js"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --secondary: #16213e;
            --panel: #0f172a;
            --accent: #e94560;
            --text: #eef;
            --muted: #9aa;
            --gold: #f5c518;
            --line: rgba(255,255,255,0.11);
            --success: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(233,69,96,0.14), transparent 28rem),
                linear-gradient(180deg, #1a1a2e 0%, #10182e 52%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        .topbar {
            position: sticky; top: 0; z-index: 200;
            background: rgba(22,33,62,0.94);
            border-bottom: 1px solid rgba(233,69,96,0.28);
            backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1.2rem; gap: 0.8rem;
        }
        .logo { font-weight: 900; color: var(--gold); letter-spacing: 0.02em; }
        .logo span { color: var(--accent); }
        .top-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }
        .nav-link {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 999px;
            padding: 0.4rem 0.8rem;
            font-size: 0.81rem; font-weight: 700;
            cursor: pointer;
        }
        .nav-link:hover { background: rgba(255,255,255,0.12); }

        .hero {
            max-width: 900px; margin: 2.5rem auto 0; padding: 0 1.2rem;
            text-align: center;
        }
        .hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; color: var(--gold); margin-bottom: 0.6rem; }
        .hero p { color: var(--muted); font-size: 1rem; line-height: 1.6; max-width: 640px; margin: 0 auto 1.6rem; }

        .filter-bar {
            max-width: 900px; margin: 0 auto 1.5rem; padding: 0 1.2rem;
            display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center;
        }
        .filter-btn {
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
            color: var(--muted);
            border-radius: 999px; padding: 0.38rem 0.9rem;
            font-size: 0.82rem; font-weight: 700; cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            color: var(--text); background: rgba(255,255,255,0.13);
            border-color: rgba(255,255,255,0.28);
        }
        .filter-btn.l1.active { background: rgba(74,222,128,0.18); border-color: #4ade80; color: #4ade80; }
        .filter-btn.l2.active { background: rgba(250,204,21,0.18); border-color: #facc15; color: #facc15; }
        .filter-btn.l3.active { background: rgba(249,115,22,0.18); border-color: #f97316; color: #f97316; }

        .search-box {
            flex: 1; min-width: 180px; max-width: 260px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px; padding: 0.4rem 1rem;
            color: var(--text); font-size: 0.85rem;
        }
        .search-box::placeholder { color: var(--muted); }
        .search-box:focus { outline: none; border-color: rgba(233,69,96,0.5); }

        .matrix {
            max-width: 900px; margin: 0 auto 3rem; padding: 0 1.2rem;
            display: flex; flex-direction: column; gap: 2rem;
        }

        .level-group {
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.09);
            overflow: hidden;
        }
        .level-header {
            padding: 0.9rem 1.3rem;
            display: flex; align-items: center; gap: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .level-badge {
            font-size: 0.75rem; font-weight: 900;
            padding: 0.25rem 0.65rem; border-radius: 6px;
            letter-spacing: 0.05em;
        }
        .level-header h2 { font-size: 1rem; font-weight: 800; }
        .level-header .grade-range { color: var(--muted); font-size: 0.83rem; margin-left: auto; }

        .grade-list { padding: 0.5rem 0; }

        .grade-row {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0.8rem 1.3rem;
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 0.8rem;
            align-items: start;
            cursor: pointer;
            transition: background 0.12s;
        }
        .grade-row:last-child { border-bottom: none; }
        .grade-row:hover { background: rgba(255,255,255,0.04); }
        .grade-row.expanded { background: rgba(255,255,255,0.04); }

        .grade-label {
            font-weight: 800; font-size: 0.9rem;
        }
        .grade-topics-preview {
            color: var(--muted); font-size: 0.82rem; line-height: 1.5;
        }
        .topic-count-badge {
            display: inline-block; background: rgba(255,255,255,0.09);
            border-radius: 6px; padding: 0.15rem 0.5rem;
            font-size: 0.75rem; font-weight: 700; margin-left: 0.4rem;
            color: var(--muted);
        }

        .topic-list {
            display: none; grid-column: 1 / -1;
            margin-top: 0.6rem;
            display: flex; flex-direction: column; gap: 0.45rem;
        }
        .topic-list.hidden { display: none !important; }

        .topic-row {
            background: rgba(22,33,62,0.7);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 0.55rem 0.9rem;
            display: flex; align-items: flex-start; gap: 0.6rem;
            flex-wrap: wrap;
        }
        .topic-name { font-size: 0.88rem; font-weight: 700; flex: 1; min-width: 160px; }
        .topic-note { color: var(--muted); font-size: 0.79rem; flex: 1; min-width: 120px; }
        .archive-link {
            display: inline-flex; align-items: center; gap: 0.3rem;
            font-size: 0.77rem; font-weight: 800;
            padding: 0.22rem 0.65rem; border-radius: 6px;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: opacity 0.15s;
        }
        .archive-link:hover { opacity: 0.82; }

        .progress-bar-wrap {
            max-width: 900px; margin: 0 auto 1.5rem; padding: 0 1.2rem;
        }
        .progress-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .progress-item { flex: 1; min-width: 160px; }
        .progress-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; font-weight: 700; }
        .progress-bar-bg { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.09); overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 99px; }

        .hidden-row { display: none; }

        @media (max-width: 600px) {
            .grade-row { grid-template-columns: 1fr; }
            .filter-bar { gap: 0.4rem; }
        }
    </style>
</head>
<body>
<nav class="topbar">
    <a href="../index.html" class="logo">SOR<span>.</span></a>
    <div class="top-actions">
        <a href="lernpfad.html" class="nav-link">🗺 Lernpfad</a>
        <a href="lernarchiv.html" class="nav-link">📚 Archiv</a>
        <a href="index.html" class="nav-link">✏️ Üben</a>
    </div>
</nav>

<div class="hero">
    <h1>Lehrplan Klasse 1–12</h1>
    <p>Alle Kernthemen des Schulunterrichts, geordnet nach Klasse und direkt verknüpft mit den passenden Archivbereichen von Second-Order Resonance.</p>
</div>

<div class="progress-bar-wrap" id="progressWrap"></div>

<div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Alle Klassen</button>
    <button class="filter-btn l1" data-filter="L1">🟢 L1 – Klasse 1–6</button>
    <button class="filter-btn l2" data-filter="L2">🟡 L2 – Klasse 7–10</button>
    <button class="filter-btn l3" data-filter="L3">🟠 L3 – Klasse 11–12</button>
    <input class="search-box" type="search" id="topicSearch" placeholder="Thema suchen…">
</div>

<div class="matrix" id="matrix"></div>

<script>
(function () {
    const data = window.SOR_CURRICULUM;
    if (!data) return;

    const matrixEl = document.getElementById('matrix');
    const progressWrap = document.getElementById('progressWrap');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('topicSearch');

    let activeFilter = 'all';
    let searchTerm = '';

    const levelColorMap = { L1: '#4ade80', L2: '#facc15', L3: '#f97316' };
    const archiveBase = 'lernarchiv.html';

    function archiveUrl(sublevel, level) {
        const lvl = level.replace('L', '');
        return `${archiveBase}?level=${lvl}&sublevel=${encodeURIComponent(sublevel)}`;
    }

    function buildProgressBars() {
        const html = `
        <div class="progress-row">
            ${data.levelGroups.map(lg => {
                const gradeCount = lg.grades.length;
                const topicCount = data.grades
                    .filter(g => lg.grades.includes(g.grade))
                    .reduce((sum, g) => sum + g.topics.length, 0);
                return `<div class="progress-item">
                    <div class="progress-label" style="color:${lg.color}">${lg.code} ${lg.title} · Klasse ${lg.grades[0]}–${lg.grades[lg.grades.length - 1]}</div>
                    <div style="font-size:0.78rem;color:var(--muted);margin-bottom:0.3rem">${gradeCount} Jahrgänge · ${topicCount} Kernthemen</div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="background:${lg.color};width:100%"></div></div>
                </div>`;
            }).join('')}
        </div>`;
        progressWrap.innerHTML = html;
    }

    function topicMatchesSearch(topic, term) {
        if (!term) return true;
        const t = term.toLowerCase();
        return topic.topic.toLowerCase().includes(t) ||
               topic.section.toLowerCase().includes(t) ||
               (topic.note && topic.note.toLowerCase().includes(t));
    }

    function gradeMatchesFilter(grade) {
        if (activeFilter === 'all') return true;
        return grade.sorLevel === activeFilter;
    }

    function buildMatrix() {
        matrixEl.innerHTML = '';
        data.levelGroups.forEach(lg => {
            if (activeFilter !== 'all' && activeFilter !== lg.code) return;

            const matchingGrades = data.grades.filter(g =>
                lg.grades.includes(g.grade) &&
                (activeFilter === 'all' || g.sorLevel === activeFilter)
            );
            if (matchingGrades.length === 0) return;

            const groupEl = document.createElement('div');
            groupEl.className = 'level-group';
            groupEl.style.background = lg.bgColor;

            groupEl.innerHTML = `
            <div class="level-header" style="background:${lg.bgColor}">
                <span class="level-badge" style="background:${lg.color}22;color:${lg.color};border:1px solid ${lg.color}55">${lg.code}</span>
                <h2>${lg.title}</h2>
                <span class="grade-range">Klasse ${lg.grades[0]}–${lg.grades[lg.grades.length - 1]}</span>
            </div>
            <div class="grade-list" id="gradeList-${lg.code}"></div>`;

            matrixEl.appendChild(groupEl);
            const gradeList = groupEl.querySelector(`#gradeList-${lg.code}`);

            matchingGrades.forEach(grade => {
                const filteredTopics = grade.topics.filter(t => topicMatchesSearch(t, searchTerm));
                if (searchTerm && filteredTopics.length === 0) return;

                const shownTopics = filteredTopics.length > 0 ? filteredTopics : grade.topics;
                const previewText = shownTopics.slice(0, 3).map(t => t.topic).join(' · ') +
                    (shownTopics.length > 3 ? ' …' : '');

                const gradeRow = document.createElement('div');
                gradeRow.className = 'grade-row';
                gradeRow.dataset.grade = grade.grade;
                gradeRow.innerHTML = `
                    <div class="grade-label" style="color:${lg.color}">${grade.title}</div>
                    <div>
                        <div class="grade-topics-preview">${previewText}<span class="topic-count-badge">${shownTopics.length} Themen</span></div>
                        <div class="topic-list hidden" id="topics-${grade.grade}">
                            ${shownTopics.map(t => `
                            <div class="topic-row">
                                <span class="topic-name">${t.topic}</span>
                                <span class="topic-note">${t.note || ''}</span>
                                <a class="archive-link"
                                   href="${archiveUrl(t.sublevel, grade.sorLevel)}"
                                   style="background:${lg.color}22;border-color:${lg.color}55;color:${lg.color}"
                                   title="Im Archiv öffnen: ${t.section}">
                                   📚 ${t.sublevel}
                                </a>
                            </div>`).join('')}
                        </div>
                    </div>`;

                gradeRow.addEventListener('click', function (e) {
                    if (e.target.tagName === 'A') return;
                    const tl = gradeRow.querySelector('.topic-list');
                    const isOpen = !tl.classList.contains('hidden');
                    tl.classList.toggle('hidden', isOpen);
                    gradeRow.classList.toggle('expanded', !isOpen);
                });

                if (searchTerm) {
                    const tl = gradeRow.querySelector('.topic-list');
                    tl && tl.classList.remove('hidden');
                    gradeRow.classList.add('expanded');
                }

                gradeList.appendChild(gradeRow);
            });
        });

        if (matrixEl.children.length === 0) {
            matrixEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:3rem 1rem">Keine Themen gefunden.</div>`;
        }
    }

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            buildMatrix();
        });
    });

    searchInput.addEventListener('input', () => {
        searchTerm = searchInput.value.trim();
        buildMatrix();
    });

    buildProgressBars();
    buildMatrix();
})();
</script>
</body>
</html>
