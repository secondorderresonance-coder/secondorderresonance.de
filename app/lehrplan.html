<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrplan-Matrix | Second-Order Resonance</title>
    <meta name="description" content="Curriculum-Abdeckungsmatrix: Klasse 1-12 Mathe-Themen und ihre Entsprechung in den L1-L3 Archiv-Abschnitten.">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --bg: #1a1a2e;
            --secondary: #16213e;
            --panel: #0f172a;
            --accent: #e94560;
            --text: #eee;
            --muted: #9aa;
            --gold: #f5c518;
            --success: #4ade80;
            --line: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(233,69,96,0.12), transparent 28rem),
                linear-gradient(180deg, #1a1a2e 0%, #10182e 52%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(22,33,62,0.94);
            border-bottom: 1px solid rgba(233,69,96,0.28);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.2rem;
            gap: 0.8rem;
        }
        .logo { font-weight: 900; color: var(--gold); letter-spacing: 0.02em; }
        .logo span { color: var(--accent); }
        .top-nav { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .nav-link {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .nav-link:hover { border-color: rgba(233,69,96,0.5); background: rgba(233,69,96,0.1); }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }

        .hero {
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
        }
        .hero h1 span { color: var(--accent); }
        .hero p { color: var(--muted); max-width: 640px; font-size: 0.97rem; line-height: 1.6; }

        .grade-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .grade-btn {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: var(--muted);
            border-radius: 10px;
            padding: 0.5rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .grade-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.28); }
        .grade-btn.active {
            background: rgba(233,69,96,0.18);
            border-color: var(--accent);
            color: var(--text);
        }
        .grade-btn .level-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        .grade-view {
            display: none;
        }
        .grade-view.active { display: block; }

        .grade-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1.1rem 1.4rem;
            background: var(--secondary);
            border-radius: 16px;
            border: 1px solid var(--line);
        }
        .grade-badge {
            font-size: 1.8rem;
            font-weight: 900;
            min-width: 56px;
            text-align: center;
            line-height: 1;
        }
        .grade-meta { flex: 1; }
        .grade-meta h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.2rem; }
        .grade-meta .stufe { font-size: 0.85rem; color: var(--muted); }
        .level-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .level-tag .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .topic-card {
            background: var(--secondary);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1.1rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            transition: border-color 0.15s;
        }
        .topic-card:hover { border-color: rgba(233,69,96,0.4); }
        .topic-card h3 {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .topic-card .topic-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
            flex: 1;
        }
        .topic-card .section-ref {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--muted);
            padding-top: 0.4rem;
            border-top: 1px solid var(--line);
        }
        .section-ref .ref-id {
            font-family: monospace;
            font-size: 0.78rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0.15rem 0.45rem;
            color: var(--gold);
            white-space: nowrap;
        }
        .section-ref .ref-title { flex: 1; }
        .archive-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(233,69,96,0.12);
            border: 1px solid rgba(233,69,96,0.3);
            color: #f0a0b0;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s;
            margin-top: 0.2rem;
            align-self: flex-start;
        }
        .archive-link:hover {
            background: rgba(233,69,96,0.22);
            color: #fff;
        }

        .overview-card {
            background: var(--secondary);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 1.3rem;
            margin-bottom: 2rem;
        }
        .overview-card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: var(--muted); }
        .coverage-bar-list { display: grid; gap: 0.7rem; }
        .coverage-row {
            display: grid;
            grid-template-columns: 140px 1fr 60px;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.85rem;
        }
        .cov-label { color: var(--text); font-weight: 600; }
        .cov-bar {
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .cov-bar > div {
            height: 100%;
            border-radius: 999px;
            transition: width 0.4s;
        }
        .cov-count { color: var(--muted); font-size: 0.8rem; text-align: right; }

        @media (max-width: 600px) {
            .topbar { padding: 0.6rem 0.9rem; }
            .topics-grid { grid-template-columns: 1fr; }
            .grade-header { flex-wrap: wrap; }
            .coverage-row { grid-template-columns: 100px 1fr 48px; }
            .cov-label { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <a class="logo" href="../index.html">Second-Order <span>Resonance</span></a>
    <nav class="top-nav">
        <a class="nav-link" href="./lernpfad.html">🗺 Lernpfad</a>
        <a class="nav-link" href="./lernarchiv.html">📚 Archiv</a>
        <a class="nav-link" href="./index.html">⚡ Aufgaben</a>
    </nav>
</header>

<main class="container">

    <div class="hero">
        <h1>Lehrplan-<span>Matrix</span></h1>
        <p>Alle Mathe-Themen von Klasse 1 bis 12 auf einen Blick – mit direktem Link zu den passenden Archiv-Abschnitten zum Üben.</p>
    </div>

    <div class="overview-card" id="overviewCard">
        <h2>Abdeckung nach Schulstufe</h2>
        <div class="coverage-bar-list" id="coverageBars"></div>
    </div>

    <div class="grade-picker" id="gradePicker"></div>

    <div id="gradeViews"></div>

</main>

<script src="./data/curriculum-matrix.js"></script>
<script>
(function () {
    const curriculum = window.SOR_CURRICULUM;
    if (!curriculum) return;

    const levelColors = {
        "L1": "#4ade80",
        "L2": "#fb923c",
        "L3": "#818cf8"
    };

    function archiveUrl(grade, topic) {
        const params = new URLSearchParams({
            level: grade.archiveLevel,
            sublevel: topic.section
        });
        return `./lernarchiv.html?${params.toString()}`;
    }

    function renderCoverageBars() {
        const container = document.getElementById("coverageBars");
        const groups = [
            { label: "Klasse 1-4", levelCode: "L1", desc: "Grundschule", klassen: [1,2,3,4] },
            { label: "Klasse 5-6", levelCode: "L1", desc: "Unterstufe", klassen: [5,6] },
            { label: "Klasse 7-9", levelCode: "L2", desc: "Mittelstufe", klassen: [7,8,9] },
            { label: "Klasse 10", levelCode: "L2", desc: "Übergang", klassen: [10] },
            { label: "Klasse 11-12", levelCode: "L3", desc: "Oberstufe", klassen: [11,12] }
        ];

        const totalTopics = curriculum.grades.reduce((s, g) => s + g.topics.length, 0);

        container.innerHTML = groups.map(grp => {
            const count = curriculum.grades
                .filter(g => grp.klassen.includes(g.klasse))
                .reduce((s, g) => s + g.topics.length, 0);
            const pct = Math.round((count / totalTopics) * 100);
            const color = levelColors[grp.levelCode] || "#888";
            return `<div class="coverage-row">
                <span class="cov-label">${grp.label}</span>
                <div class="cov-bar"><div style="width:${pct}%;background:${color}"></div></div>
                <span class="cov-count">${count} Themen</span>
            </div>`;
        }).join("");
    }

    function renderGradePicker() {
        const picker = document.getElementById("gradePicker");
        picker.innerHTML = curriculum.grades.map((g, i) => {
            const color = levelColors[g.levelCode] || "#888";
            return `<button
                class="grade-btn${i === 0 ? " active" : ""}"
                data-klasse="${g.klasse}"
                title="${g.stufe}"
            ><span class="level-dot" style="background:${color}"></span>${g.label}</button>`;
        }).join("");

        picker.addEventListener("click", e => {
            const btn = e.target.closest(".grade-btn");
            if (!btn) return;
            picker.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            showGrade(Number(btn.dataset.klasse));
        });
    }

    function renderGradeViews() {
        const container = document.getElementById("gradeViews");
        container.innerHTML = curriculum.grades.map((grade, i) => {
            const color = levelColors[grade.levelCode] || "#888";
            const topicsHtml = grade.topics.map(topic => {
                const url = archiveUrl(grade, topic);
                return `<div class="topic-card">
                    <h3>${topic.title}</h3>
                    <p class="topic-desc">${topic.desc}</p>
                    <div class="section-ref">
                        <span class="ref-id">${topic.section}</span>
                        <span class="ref-title">${topic.sectionTitle}</span>
                    </div>
                    <a class="archive-link" href="${url}">Im Archiv üben →</a>
                </div>`;
            }).join("");

            return `<div class="grade-view${i === 0 ? " active" : ""}" id="grade-view-${grade.klasse}">
                <div class="grade-header">
                    <div class="grade-badge" style="color:${color}">${grade.klasse}</div>
                    <div class="grade-meta">
                        <h2>${grade.label}</h2>
                        <div class="stufe">${grade.stufe}</div>
                    </div>
                    <div class="level-tag">
                        <span class="dot" style="background:${color}"></span>
                        ${grade.levelCode} – ${window.SOR_CURRICULUM.meta.levels[grade.levelCode]}
                    </div>
                </div>
                <div class="topics-grid">${topicsHtml}</div>
            </div>`;
        }).join("");
    }

    function showGrade(klasse) {
        document.querySelectorAll(".grade-view").forEach(v => v.classList.remove("active"));
        const view = document.getElementById(`grade-view-${klasse}`);
        if (view) view.classList.add("active");
    }

    renderCoverageBars();
    renderGradePicker();
    renderGradeViews();

    // Allow deep-link via ?klasse=7
    const params = new URLSearchParams(location.search);
    const initial = Number(params.get("klasse"));
    if (initial >= 1 && initial <= 12) {
        document.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("active"));
        const btn = document.querySelector(`[data-klasse="${initial}"]`);
        if (btn) btn.classList.add("active");
        showGrade(initial);
    }
})();
</script>
</body>
</html>
