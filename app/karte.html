            (w ? '<text y="5.5" style="font-size:15px;stroke-width:0;fill:#f5c518">★</text>' : '<circle class="core" r="' + (v ? 7 : 3.5) + '" fill="' + (v ? LV[n.lv] : "rgba(255,255,255,0.5)") + '"/>') +
            (st ? '<text y="-19" style="font-size:11px;fill:#f5c518;stroke-width:3px">' + "★".repeat(st) + "</text>" : "") +
            '<text y="' + (w ? 34 : 31) + '">' + esc(L(n.t)) + "</text></g>";
    }).join("") + "</g>";
    svg.innerHTML = h;

    // ---------- Auswahl ----------
    var sel = null, filter = 0, panel = document.getElementById("panel");
    function nodeEl(id) { return svg.querySelector('.node[data-id="' + id + '"]'); }
    function intro() {
        var total = MM.nodes.length, vis = MM.nodes.filter(visited).length;
        panel.innerHTML = '<div class="kicker">' + $t("Dein Reisepass", "Your passport") + "</div><h2>" + vis + $t(" von ", " of ") + total + $t(" Orten besucht", " places visited") + '</h2><div class="bar" style="margin:0.4rem 0 1rem"><span style="width:' + Math.round(vis / total * 100) + '%"></span></div><p>' +
            $t("Ein Ort gilt als besucht, sobald du dort eine Aufgabe gelöst oder ein Wunder erkundet hast. Die gestrichelten Linien sind Wege: Sie führen vom Einfachen zum Schweren.", "A place counts as visited once you have solved an exercise or explored a wonder there. The dashed lines are paths: they lead from the simple to the hard.") +
            '</p><div class="rel"><small>' + $t("Gute Startpunkte", "Good starting points") + "</small>" + ["zaehlen", "terme", "ableitung", "euler"].map(function (id) { return '<button type="button" data-goto="' + id + '">' + esc(L(MM.byId(id).t)) + "</button>"; }).join("") + "</div>";
    }
    function select(id, focusMap) {
        var n = MM.byId(id); if (!n) return;
        sel = id;
        Array.prototype.forEach.call(svg.querySelectorAll(".node"), function (el) { el.classList.toggle("sel", el.getAttribute("data-id") === id); });
        var tr = "";
        Array.prototype.forEach.call(svg.querySelectorAll(".edge"), function (el) { var inn = el.getAttribute("data-b") === id, out = el.getAttribute("data-a") === id; el.classList.toggle("in", inn); el.classList.toggle("out", out); if (inn) tr += '<circle r="5" fill="#f5c518"><animateMotion dur="1.8s" repeatCount="indefinite" path="' + el.getAttribute("d") + '"/></circle>'; });
        svg.querySelector("#travel").innerHTML = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "" : tr;
        var next = MM.nodes.filter(function (m) { return m.pre.indexOf(id) >= 0; }), kind = n.link.slice(0, 1), st = stars(n);
        panel.innerHTML = '<span class="chip" style="border-color:' + LV[n.lv] + ";color:" + LV[n.lv] + '">L' + n.lv + " · " + LVN[n.lv] + "</span>" + (visited(n) ? ' <span class="chip" style="color:var(--teal);border-color:rgba(53,224,196,0.4)">✓ ' + $t("besucht", "visited") + "</span>" : "") +
            "<h2>" + esc(L(n.t)) + "</h2>" + (st ? '<div style="margin-bottom:0.5rem">' + SOR_NAV.stars(st) + "</div>" : "") + "<p>" + esc(L(n.d)) + "</p>" +
            (n.pre.length ? '<div class="rel"><small>' + $t("Das brauchst du vorher", "You need this first") + "</small>" + n.pre.map(function (p) { return '<button type="button" data-goto="' + p + '">' + esc(L(MM.byId(p).t)) + "</button>"; }).join("") + "</div>" : '<div class="rel"><small>' + $t("Startpunkt: kein Vorwissen nötig", "Starting point: no prior knowledge needed") + "</small></div>") +
            (next.length ? '<div class="rel"><small>' + $t("Von hier geht es weiter zu", "From here you can go on to") + "</small>" + next.map(function (p) { return '<button type="button" data-goto="' + p.id + '">' + esc(L(p.t)) + "</button>"; }).join("") + "</div>" : "") +
            '<div class="go"><a class="btn btn-primary" href="' + MM.href(n.link) + '">' + (kind === "u" ? $t("Hier üben", "Practise here") : kind === "k" ? $t("Zum Kurs", "Open course") : $t("Wunder erkunden", "Explore wonder")) + ' →</a><button type="button" class="btn btn-ghost" data-goto="">' + $t("Schließen", "Close") + "</button></div>";
        if (focusMap) flyTo(n.x, n.y);
        if (window.SOR_FX) SOR_FX.setContext({ level: n.lv });
        if (history.replaceState) history.replaceState(null, "", "karte.html?ort=" + id);
    }
    function clearSel() { sel = null; Array.prototype.forEach.call(svg.querySelectorAll(".sel,.in,.out"), function (el) { el.classList.remove("sel", "in", "out"); }); svg.querySelector("#travel").innerHTML = ""; intro(); if (history.replaceState) history.replaceState(null, "", "karte.html"); }
    panel.addEventListener("click", function (e) { var b = e.target.closest("[data-goto]"); if (!b) return; var id = b.getAttribute("data-goto"); if (id) select(id, true); else clearSel(); });
    svg.addEventListener("keydown", function (e) { var g = e.target.closest && e.target.closest(".node"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.getAttribute("data-id")); } });

    // ---------- Filter und Liste ----------
    var fl = document.getElementById("filters");
    fl.innerHTML = '<button type="button" data-f="0" aria-pressed="true">' + $t("Alle", "All") + "</button>" + [1, 2, 3, 4, 5, 6].map(function (l) { return '<button type="button" data-f="' + l + '" aria-pressed="false" style="--lc:' + LV[l] + '" title="' + LVN[l] + '">L' + l + "</button>"; }).join("");
    fl.addEventListener("click", function (e) { var b = e.target.closest("[data-f]"); if (!b) return; filter = parseInt(b.getAttribute("data-f"), 10); Array.prototype.forEach.call(fl.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); }); Array.prototype.forEach.call(svg.querySelectorAll(".node"), function (el) { el.classList.toggle("dim", !!filter && parseInt(el.getAttribute("data-lv"), 10) !== filter); }); Array.prototype.forEach.call(svg.querySelectorAll(".edge"), function (el) { el.classList.toggle("dim", !!filter); }); });
    document.getElementById("legend").innerHTML = [1, 2, 3, 4, 5, 6].map(function (l) { return '<span><i style="background:' + LV[l] + '"></i>L' + l + " " + LVN[l] + "</span>"; }).join("") + "<span>★ " + $t("Mathe-Wunder", "Maths wonder") + "</span>";
    var pl = document.getElementById("places");
    pl.innerHTML = "<h2>" + $t("Alle Orte nach Level", "All places by level") + "</h2>" + [1, 2, 3, 4, 5, 6].map(function (l) { return '<div class="lv"><span class="chip" style="border-color:' + LV[l] + ";color:" + LV[l] + ';align-self:start;justify-self:start">L' + l + "</span><div>" + MM.nodes.filter(function (n) { return n.lv === l; }).map(function (n) { return '<button type="button" data-goto="' + n.id + '"' + (visited(n) ? ' class="vis"' : "") + ">" + esc(L(n.t)) + "</button>"; }).join("") + "</div></div>"; }).join("");
    pl.addEventListener("click", function (e) { var b = e.target.closest("[data-goto]"); if (!b) return; select(b.getAttribute("data-goto"), true); document.querySelector(".mapbox").scrollIntoView({ behavior: "smooth", block: "start" }); });

    // ---------- Verschieben und Zoomen ----------
    var vb = { x: 0, y: 0, w: 1600, h: 1000 }, anim = null;
    function setVB() { svg.setAttribute("viewBox", r1(vb.x) + " " + r1(vb.y) + " " + r1(vb.w) + " " + r1(vb.h)); }
    function clamp() { vb.w = Math.max(360, Math.min(1600, vb.w)); vb.h = vb.w * 0.625; vb.x = Math.max(-80, Math.min(1680 - vb.w, vb.x)); vb.y = Math.max(-60, Math.min(1060 - vb.h, vb.y)); }
    function tweenTo(tx, ty, tw) {
        cancelAnimationFrame(anim); var s = { x: vb.x, y: vb.y, w: vb.w }, t0 = null, red = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var step = function (ts) { if (t0 === null) t0 = ts; var k = red ? 1 : Math.min(1, (ts - t0) / 520), e = 1 - Math.pow(1 - k, 3); vb.w = s.w + (tw - s.w) * e; vb.h = vb.w * 0.625; vb.x = s.x + (tx - s.x) * e; vb.y = s.y + (ty - s.y) * e; clamp(); setVB(); if (k < 1) anim = requestAnimationFrame(step); };
        anim = requestAnimationFrame(step);
    }
    function flyTo(x, y) { var w = Math.min(vb.w, 900); tweenTo(x - w / 2, y - w * 0.625 / 2, w); }
    function zoom(f, cx, cy) { cx = cx === undefined ? vb.x + vb.w / 2 : cx; cy = cy === undefined ? vb.y + vb.h / 2 : cy; var w = Math.max(360, Math.min(1600, vb.w * f)), k = w / vb.w; tweenTo(cx - (cx - vb.x) * k, cy - (cy - vb.y) * k, w); }
    document.getElementById("zin").addEventListener("click", function () { zoom(0.7); });
    document.getElementById("zout").addEventListener("click", function () { zoom(1.4); });
    document.getElementById("zall").addEventListener("click", function () { tweenTo(0, 0, 1600); });
    var ptrs = {}, moved = 0, pinch = 0, downId = null;
    function scale() { var r = svg.getBoundingClientRect(); return Math.max(vb.w / r.width, vb.h / r.height); }
    svg.addEventListener("pointerdown", function (e) { ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = 0; var g = e.target.closest(".node"); downId = g ? g.getAttribute("data-id") : null; cancelAnimationFrame(anim); try { svg.setPointerCapture(e.pointerId); } catch (er) { /* ok */ } });
    svg.addEventListener("pointermove", function (e) {
        var p = ptrs[e.pointerId]; if (!p) return; var ids = Object.keys(ptrs), s = scale();
        if (ids.length === 1) { var dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy); if (moved > 6) { svg.classList.add("drag"); vb.x -= dx * s; vb.y -= dy * s; clamp(); setVB(); } }
        p.x = e.clientX; p.y = e.clientY;
        if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) { var f = pinch / d, r = svg.getBoundingClientRect(), cx = vb.x + ((a.x + b.x) / 2 - r.left) * s, cy = vb.y + ((a.y + b.y) / 2 - r.top) * s, w = Math.max(360, Math.min(1600, vb.w * f)), k = w / vb.w; vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = w; clamp(); setVB(); } pinch = d; moved = 99; }
    });
    function up(e) { delete ptrs[e.pointerId]; pinch = 0; svg.classList.remove("drag"); if (moved <= 6 && downId && e.type === "pointerup") select(downId); else if (moved <= 6 && e.type === "pointerup" && sel) clearSel(); downId = null; }
    svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
    svg.addEventListener("wheel", function (e) { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); var r = svg.getBoundingClientRect(), s = scale(), f = e.deltaY > 0 ? 1.15 : 0.87, cx = vb.x + (e.clientX - r.left) * s, cy = vb.y + (e.clientY - r.top) * s, w = Math.max(360, Math.min(1600, vb.w * f)), k = w / vb.w; vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = w; clamp(); setVB(); }, { passive: false });

    // ---------- Start ----------
    var ort = new URLSearchParams(location.search).get("ort");
    if (ort && MM.byId(ort)) select(ort, true); else { intro(); if (window.innerWidth < 700) { vb.w = 760; vb.x = 20; vb.y = 520; clamp(); setVB(); } }
})();
</script>
