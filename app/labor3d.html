<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D-Labor | Second-Order Resonance</title>
<meta name="description" content="Mathematik in 3D zum Anfassen: Körper, Rotationskörper, Funktionsgebirge und die Euler-Spirale. Drehen, verändern, verstehen.">
<meta name="theme-color" content="#0a0e1c">
<link rel="stylesheet" href="./vendor/fonts/fonts.css?v=3.0.0">
<link rel="stylesheet" href="./modules/sor-ui.css?v=3.0.0">
<style>
  .lab-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:end;margin-bottom:1.3rem}
  .lab-top h1{font-size:clamp(2rem,4.4vw,3rem);margin:0.4rem 0 0.4rem}
  .lab-top h1 .serif{color:var(--accent);font-size:1.12em}
  .tabs{display:flex;gap:0.5rem;overflow-x:auto;padding-bottom:0.5rem;margin-bottom:1rem;scrollbar-width:thin}
  .tab{flex:0 0 auto;display:grid;gap:0.1rem;text-align:left;padding:0.7rem 1rem;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-width:170px;transition:border-color .2s,background .2s}
  .tab small{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim)}
  .tab b{font-family:'Space Grotesk',sans-serif;font-weight:600}
  .tab:hover{border-color:var(--line2)}
  .tab[aria-selected="true"]{border-color:rgba(245,197,24,0.6);background:rgba(245,197,24,0.07)}
  .tab[aria-selected="true"] small{color:var(--accent)}
  .lab3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#06080f;box-shadow:0 40px 100px rgba(0,0,0,0.5)}
  .stage{position:relative;min-height:600px;border-right:1px solid rgba(255,255,255,0.06);background:radial-gradient(800px 480px at 50% 55%,rgba(53,224,196,0.07),transparent 65%)}
  .stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
  .stage canvas:active{cursor:grabbing}
  .stage-head{position:absolute;top:1.2rem;left:1.4rem;right:1.4rem;pointer-events:none;z-index:2}
  .stage-head h2{font-size:1.35rem;color:#f3efe6}
  .stage-head h2 em{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
  .stage-head p{font-family:'Instrument Serif',Georgia,serif;font-style:italic;color:#8f97ad;font-size:1.05rem}
  .readout{position:absolute;left:1.4rem;bottom:1.2rem;z-index:2;pointer-events:none;display:grid;gap:0.15rem}
  .readout div{font-weight:600;font-size:clamp(1rem,1.9vw,1.3rem);color:#8f97ad;line-height:1.25}
  .readout div b{color:var(--text);text-transform:none}
  .readout small{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--dim);letter-spacing:0.06em}
  .hint3d{position:absolute;right:1.2rem;bottom:1.2rem;z-index:2;font-family:'IBM Plex Mono',monospace;font-size:0.64rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);pointer-events:none}
  .panel{padding:1.4rem;display:flex;flex-direction:column;gap:1rem;background:rgba(255,255,255,0.015)}
  .seg{display:flex;flex-wrap:wrap;gap:0.4rem}
  .seg button{padding:0.45rem 0.8rem;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:0.88rem;color:var(--soft)}
  .seg button[aria-pressed="true"]{border-color:var(--accent);color:#0a0e1c;background:var(--accent);font-weight:600}
  .ctl label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.3rem}
  .ctl label span:last-child{color:var(--accent);text-transform:none;letter-spacing:0.02em}
  .ctl input[type=range]{width:100%;accent-color:#f5c518}
  .fx{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-size:1.25rem;color:#f3efe6;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-left:2px solid var(--accent);border-radius:10px;padding:0.55rem 0.85rem;display:grid;gap:0.15rem}
  .fx sup,.fx sub{font-size:0.65em}
  .idea{font-size:0.93rem;color:var(--soft);border-left:2px solid rgba(53,224,196,0.5);padding-left:0.8rem}
  .check{display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;color:var(--soft);cursor:pointer}
  .check input{accent-color:#f5c518;width:16px;height:16px}
  .panel-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:auto}
  .nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;color:var(--muted)}
  @media (max-width:900px){
    .lab-top{grid-template-columns:1fr}
    .lab3{grid-template-columns:1fr}
    .stage{min-height:440px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06)}
    .hint3d{display:none}
  }
</style>
</head>
<body>
<div id="sorHeader" data-page="labor3d"></div>

<main class="wrap">
  <section class="lab-top">
    <div>
      <div class="kicker">3D-Labor</div>
      <h1>Mathe zum <span class="serif">Anfassen</span></h1>
      <p class="muted" style="max-width:38rem">Dreh die Objekte mit Maus oder Finger, verändere die Regler und beobachte, wie sich die Zahlen mitbewegen.</p>
    </div>
  </section>

  <div class="tabs" id="tabs" role="tablist" aria-label="Szenen"></div>

  <section class="lab3">
    <div class="stage" id="stage">
      <div class="stage-head"><h2 id="sTitle"></h2><p id="sSub"></p></div>
      <div class="readout" id="readout" aria-live="polite"></div>
      <div class="hint3d">Ziehen dreht · Scrollen zoomt</div>
    </div>
    <div class="panel" id="panel"></div>
  </section>
</main>

<script src="./modules/sor-core.js?v=3.0.0"></script>
<script src="./modules/rewards.js?v=3.0.0"></script>
<script src="./modules/sor-nav.js?v=3.0.0"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/OrbitControls.js";

const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => Number(v).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = $("stage");
const C = { yellow: 0xf5c518, teal: 0x35e0c4, red: 0xe94560, blue: 0x60a5fa, violet: 0x8b5cf6, text: 0xeef1f7, grid: 0x2a3350 };

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
catch (e) { stage.insertAdjacentHTML("beforeend", '<div class="nogl">Dein Browser kann hier keine 3D-Grafik darstellen (WebGL ist nicht verfügbar).<br>Die Rotationskörper auf der Startseite funktionieren auch ohne WebGL.</div>'); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
renderer.domElement.setAttribute("role", "img");
renderer.domElement.setAttribute("tabindex", "0");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false; controls.minDistance = 3; controls.maxDistance = 22;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.9;
controls.addEventListener("start", () => { controls.autoRotate = false; });
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x0a0e1c, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(4, 7, 5); scene.add(sun);
const fill = new THREE.DirectionalLight(0x35e0c4, 0.5); fill.position.set(-5, 2, -4); scene.add(fill);

// ---------- Helfer ----------
function ramp(t) { // blau -> türkis -> lime -> gelb -> orange
    const S = [[76, 110, 245], [34, 195, 166], [163, 230, 53], [250, 204, 21], [251, 146, 60]];
    t = Math.max(0, Math.min(1, t)) * (S.length - 1); const i = Math.min(S.length - 2, Math.floor(t)), u = t - i;
    return [0, 1, 2].map(k => (S[i][k] + (S[i + 1][k] - S[i][k]) * u) / 255);
}
function label(text, color = "#cdd4e6", size = 0.42) {
    const cv = document.createElement("canvas"), ctx = cv.getContext("2d"); ctx.font = "600 64px 'IBM Plex Sans', sans-serif";
    cv.width = Math.ceil(ctx.measureText(text).width) + 24; cv.height = 84;
    ctx.font = "600 64px 'IBM Plex Sans', sans-serif"; ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.fillText(text, 12, 44);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sp.scale.set(size * cv.width / cv.height, size, 1); return sp;
}
function line(points, color, opts = {}) {
    const g = new THREE.BufferGeometry().setFromPoints(points);
    const m = opts.dashed ? new THREE.LineDashedMaterial({ color, dashSize: 0.12, gapSize: 0.1, transparent: true, opacity: opts.opacity ?? 1 }) : new THREE.LineBasicMaterial({ color, transparent: true, opacity: opts.opacity ?? 1 });
    const l = new THREE.Line(g, m); if (opts.dashed) l.computeLineDistances(); return l;
}
function tube(points, color, radius = 0.035) {
    return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), Math.max(32, points.length * 2), radius, 8, false), new THREE.MeshStandardMaterial({ color, roughness: 0.35, emissive: color, emissiveIntensity: 0.25 }));
}
function floorGrid(size, y) { const g = new THREE.GridHelper(size, size * 2, C.grid, C.grid); g.position.y = y; g.material.transparent = true; g.material.opacity = 0.55; return g; }
function dispose(obj) { obj.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); } }); }
function simpson(f, a, b, n = 400) { const h = (b - a) / n; let s = f(a) + f(b); for (let i = 1; i < n; i++) s += f(a + i * h) * (i % 2 ? 4 : 2); return s * h / 3; }
const slider = (id, lab, min, max, step, val) => `<div class="ctl" id="w_${id}"><label for="${id}"><span>${lab}</span><span id="v_${id}"></span></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
const seg = (id, items, cur) => `<div class="seg" id="${id}" role="group">${items.map(([k, t]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}">${t}</button>`).join("")}</div>`;
function bindSeg(id, fn) { $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; [...$(id).children].forEach(x => x.setAttribute("aria-pressed", x === b)); fn(b.dataset.k); }); }
const readout = rows => { $("readout").innerHTML = rows.map(r => r[2] ? `<small>${r[0]}</small>` : `<div>${r[0]} <b>${r[1]}</b></div>`).join(""); };
const practice = (topic, text) => `<div class="panel-actions"><a class="btn btn-primary btn-sm" href="ueben.html?thema=${topic}&zurueck=${encodeURIComponent("labor3d.html?szene=" + current)}">${text} →</a><button class="btn btn-ghost btn-sm" type="button" id="spinBtn">↻ Drehen</button></div>`;

let group = null, current = "", tick = null;
function setGroup(g) { if (group) { scene.remove(group); dispose(group); } group = g; scene.add(g); }

// ---------- Szene 1: Körper ----------
const solids = {
    quader: { name: "Quader", p: [["a", "Länge a", 1, 4, 3], ["b", "Breite b", 1, 4, 2], ["c", "Höhe c", 1, 4, 2]], fx: ["V = a · b · c", "O = 2 · (ab + ac + bc)"], idea: "Das Volumen zählt, wie viele Einheitswürfel hineinpassen: Grundfläche mal Höhe.", calc: v => ({ V: v.a * v.b * v.c, O: 2 * (v.a * v.b + v.a * v.c + v.b * v.c) }) },
    zylinder: { name: "Zylinder", p: [["r", "Radius r", 0.5, 2, 1.2], ["h", "Höhe h", 1, 4, 2.5]], fx: ["V = π · r<sup>2</sup> · h", "O = 2πr<sup>2</sup> + 2πrh"], idea: "Auch hier gilt Grundfläche mal Höhe. Die Grundfläche ist ein Kreis.", calc: v => ({ V: Math.PI * v.r * v.r * v.h, O: 2 * Math.PI * v.r * v.r + 2 * Math.PI * v.r * v.h }) },
    kegel: { name: "Kegel", p: [["r", "Radius r", 0.5, 2, 1.2], ["h", "Höhe h", 1, 4, 2.5]], fx: ["V = ⅓ · π · r<sup>2</sup> · h", "O = πr<sup>2</sup> + πr · s,  s = √(r<sup>2</sup> + h<sup>2</sup>)"], idea: "Ein Kegel hat genau ein Drittel des Volumens des Zylinders, in den er passt. Blende den Umkörper ein und vergleiche.", hull: true, calc: v => ({ V: Math.PI * v.r * v.r * v.h / 3, O: Math.PI * v.r * v.r + Math.PI * v.r * Math.hypot(v.r, v.h), hullV: Math.PI * v.r * v.r * v.h }) },
    pyramide: { name: "Pyramide", p: [["a", "Grundkante a", 1, 4, 2.4], ["h", "Höhe h", 1, 4, 2.5]], fx: ["V = ⅓ · a<sup>2</sup> · h", "O = a<sup>2</sup> + 2a · h<sub>s</sub>,  h<sub>s</sub> = √(h<sup>2</sup> + (a/2)<sup>2</sup>)"], idea: "Wie beim Kegel: ein Drittel des umschließenden Quaders.", hull: true, calc: v => ({ V: v.a * v.a * v.h / 3, O: v.a * v.a + 2 * v.a * Math.hypot(v.h, v.a / 2), hullV: v.a * v.a * v.h }) },
    kugel: { name: "Kugel", p: [["r", "Radius r", 0.5, 2, 1.4]], fx: ["V = 4/3 · π · r<sup>3</sup>", "O = 4 · π · r<sup>2</sup>"], idea: "Verdoppelst du den Radius, wächst die Oberfläche auf das 4-fache und das Volumen auf das 8-fache.", calc: v => ({ V: 4 / 3 * Math.PI * v.r ** 3, O: 4 * Math.PI * v.r * v.r }) }
};
function sceneKoerper() {
    let kind = "kegel", hull = false; const val = {};
    const build = () => {
        const S = solids[kind], g = new THREE.Group(); let geo, hullGeo = null, y = 0;
        if (kind === "quader") { geo = new THREE.BoxGeometry(val.a, val.c, val.b); y = val.c / 2; }
        if (kind === "zylinder") { geo = new THREE.CylinderGeometry(val.r, val.r, val.h, 64); y = val.h / 2; }
        if (kind === "kegel") { geo = new THREE.ConeGeometry(val.r, val.h, 64); y = val.h / 2; hullGeo = new THREE.CylinderGeometry(val.r, val.r, val.h, 48); }
        if (kind === "pyramide") { geo = new THREE.ConeGeometry(val.a / Math.SQRT2, val.h, 4); geo.rotateY(Math.PI / 4); y = val.h / 2; hullGeo = new THREE.BoxGeometry(val.a, val.h, val.a); }
        if (kind === "kugel") { geo = new THREE.SphereGeometry(val.r, 64, 40); y = val.r; }
        const base = -1.4;
        const mesh = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: C.teal, roughness: 0.25, metalness: 0.05, transparent: true, opacity: 0.72, side: THREE.DoubleSide, clearcoat: 0.6 }));
        mesh.position.y = base + y; g.add(mesh);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: C.text })); edges.position.copy(mesh.position); g.add(edges);
        if (hull && hullGeo) { const h = new THREE.LineSegments(new THREE.EdgesGeometry(hullGeo, 25), new THREE.LineDashedMaterial({ color: C.yellow, dashSize: 0.12, gapSize: 0.09 })); h.computeLineDistances(); h.position.copy(mesh.position); g.add(h); }
        g.add(floorGrid(8, base));
        setGroup(g);
        const r = S.calc(val), rows = [["Volumen", "≈ " + fmt(r.V)], ["Oberfläche", "≈ " + fmt(r.O)]];
        if (hull && r.hullV) rows.push([`Umkörper: ${fmt(r.hullV)} · davon genau ⅓`, "", true]);
        readout(rows);
    };
    const panel = () => {
        const S = solids[kind];
        S.p.forEach(p => { if (val[p[0]] === undefined || !$(p[0])) val[p[0]] = p[4]; });
        $("panel").innerHTML = seg("kindSeg", Object.keys(solids).map(k => [k, solids[k].name]), kind) +
            S.p.map(p => slider(p[0], p[1], p[2], p[3], 0.1, val[p[0]] ?? p[4])).join("") +
            (S.hull ? `<label class="check"><input type="checkbox" id="hull" ${hull ? "checked" : ""}> Umkörper einblenden</label>` : "") +
            `<div class="fx">${S.fx.map(f => `<span>${f}</span>`).join("")}</div><p class="idea">${S.idea}</p>` + practice("CM-S-33", "Körper üben");
        bindSeg("kindSeg", k => { kind = k; Object.keys(val).forEach(x => delete val[x]); solids[k].p.forEach(p => { val[p[0]] = p[4]; }); panel(); build(); });
        S.p.forEach(p => { const el = $(p[0]); val[p[0]] = Number(el.value); $("v_" + p[0]).textContent = fmt(val[p[0]], 1); el.addEventListener("input", () => { val[p[0]] = Number(el.value); $("v_" + p[0]).textContent = fmt(val[p[0]], 1); build(); }); });
        if ($("hull")) $("hull").addEventListener("change", e => { hull = e.target.checked; build(); });
        bindSpin();
    };
    camera.position.set(5.2, 3.6, 6.6); controls.target.set(0, 0, 0);
    panel(); build(); tick = null;
}

// ---------- Szene 2: Rotationskörper ----------
const profiles = {
    vase: { name: "Vase", f: x => 0.7 + 0.3 * Math.sin(2 * x), a: 0, b: Math.PI, fx: "V = π <span class='int'><span class='sym'>∫</span><span class='lim'><sup>π</sup><sub>0</sub></span></span> (0,7 + 0,3·sin 2x)<sup>2</sup> dx" },
    kegel: { name: "Kegel", f: x => x / 2, a: 0, b: 4, fx: "V = π <span class='int'><span class='sym'>∫</span><span class='lim'><sup>4</sup><sub>0</sub></span></span> (x/2)<sup>2</sup> dx = 16π/3" },
    paraboloid: { name: "Paraboloid", f: x => Math.sqrt(Math.max(0, x)), a: 0, b: 4, fx: "V = π <span class='int'><span class='sym'>∫</span><span class='lim'><sup>4</sup><sub>0</sub></span></span> (√x)<sup>2</sup> dx = 8π" },
    horn: { name: "Gabriels Horn", f: x => 1 / x, a: 1, b: 8, fx: "V = π <span class='int'><span class='sym'>∫</span><span class='lim'><sup>∞</sup><sub>1</sub></span></span> dx / x<sup>2</sup> = π" }
};
function sceneRotation() {
    let kind = "vase", sweep = 360, slice = 0.5;
    const build = () => {
        const P = profiles[kind], g = new THREE.Group(), inner = new THREE.Group(), N = 80, pts = [], mid = (P.a + P.b) / 2;
        let rmax = 0; for (let i = 0; i <= N; i++) { const x = P.a + (P.b - P.a) * i / N, r = P.f(x); rmax = Math.max(rmax, r); pts.push(new THREE.Vector2(Math.max(r, 0.0001), x - mid)); }
        const geo = new THREE.LatheGeometry(pts, 72, 0, sweep * Math.PI / 180), pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++) { const c = ramp((pos.getY(i) + mid - P.a) / (P.b - P.a)); col.set(c, i * 3); }
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        inner.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.45, metalness: 0.05 })));
        inner.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.LatheGeometry(pts.filter((_, i) => i % 4 === 0), 24, 0, sweep * Math.PI / 180)), new THREE.LineBasicMaterial({ color: 0x0a0e1c, transparent: true, opacity: 0.35 })));
        inner.add(tube(pts.map(p => new THREE.Vector3(p.x, p.y, 0)), C.text, 0.02));
        const xs = P.a + (P.b - P.a) * slice, rs = P.f(xs);
        const disc = new THREE.Mesh(new THREE.CircleGeometry(rs, 64), new THREE.MeshBasicMaterial({ color: C.red, transparent: true, opacity: 0.28, side: THREE.DoubleSide })); disc.rotation.x = -Math.PI / 2; disc.position.y = xs - mid; inner.add(disc);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(rs, 0.035, 10, 80), new THREE.MeshBasicMaterial({ color: C.red })); ring.rotation.x = Math.PI / 2; ring.position.y = xs - mid; inner.add(ring);
        inner.rotation.z = -Math.PI / 2; g.add(inner);
        g.add(line([new THREE.Vector3(P.a - mid - 0.6, 0, 0), new THREE.Vector3(P.b - mid + 0.6, 0, 0)], C.text, { dashed: true, opacity: 0.5 }));
        g.add(floorGrid(10, -rmax - 0.5));
        const sc = Math.min(1.5, 5.2 / (P.b - P.a)); g.scale.setScalar(sc);
        setGroup(g);
        const V = Math.PI * simpson(x => P.f(x) ** 2, P.a, P.b), part = Math.PI * simpson(x => P.f(x) ** 2, P.a, xs);
        readout([["Rotiert", sweep + "°"], ["Volumen", "≈ " + fmt(V * sweep / 360, 3)], [`Scheiben bis x = ${fmt(xs)} ergeben ${fmt(part, 3)} von ${fmt(V, 3)} · Scheibe π·r² = ${fmt(Math.PI * rs * rs, 3)}`, "", true]]);
    };
    $("panel").innerHTML = seg("profSeg", Object.keys(profiles).map(k => [k, profiles[k].name]), kind) + slider("sweep", "Drehwinkel", 0, 360, 1, 360) + slider("slice", "Scheibe bei x", 0, 100, 1, 50) +
        `<div class="fx"><span id="rotFx"></span></div><p class="idea">Jede Scheibe ist ein flacher Zylinder mit Volumen π · f(x)² · dx. Das Integral addiert alle Scheiben.</p>` + practice("CM-S-38", "Integrale üben");
    const sync = () => { $("v_sweep").textContent = sweep + "°"; $("v_slice").textContent = fmt(slice * 100, 0) + " %"; $("rotFx").innerHTML = profiles[kind].fx; };
    bindSeg("profSeg", k => { kind = k; sync(); build(); });
    $("sweep").addEventListener("input", e => { sweep = Number(e.target.value); sync(); build(); });
    $("slice").addEventListener("input", e => { slice = Number(e.target.value) / 100; sync(); build(); });
    bindSpin(); camera.position.set(3.8, 3.2, 9.4); controls.target.set(0, 0, 0); sync();
    if (reduceMotion) { build(); tick = null; return; }
    sweep = 0; const t0 = performance.now();
    tick = now => { const p = Math.min(1, (now - t0) / 1600), e = 1 - Math.pow(1 - p, 3), s = Math.round(360 * e); if (s !== sweep) { sweep = s; $("sweep").value = s; sync(); build(); } if (p >= 1) tick = null; };
    build();
}

// ---------- Szene 3: Funktionsgebirge ----------
const surfaces = {
    paraboloid: { name: "Paraboloid", f: (x, y) => 0.35 * (x * x + y * y) - 1.2, tex: "f(x, y) = x² + y²", idea: "Ein Minimum: der Gradient zeigt überall vom tiefsten Punkt weg und wird dort null." },
    sattel: { name: "Sattel", f: (x, y) => 0.35 * (x * x - y * y), tex: "f(x, y) = x² − y²", idea: "Im Ursprung ist der Gradient null, trotzdem ist es kein Extremum: in x-Richtung geht es bergauf, in y-Richtung bergab." },
    wellen: { name: "Wellen", f: (x, y) => 0.8 * Math.sin(1.6 * x) * Math.cos(1.6 * y), tex: "f(x, y) = sin x · cos y", idea: "Viele Hoch-, Tief- und Sattelpunkte. Such die Stellen, an denen der Pfeil verschwindet." },
    glocke: { name: "Glocke", f: (x, y) => 1.8 * Math.exp(-(x * x + y * y) / 1.4) - 0.9, tex: "f(x, y) = e<sup>−(x² + y²)</sup>", idea: "Ein Maximum: der Gradient zeigt von allen Seiten zum Gipfel." },
    affe: { name: "Affensattel", f: (x, y) => 0.14 * (x * x * x - 3 * x * y * y), tex: "f(x, y) = x³ − 3xy²", idea: "Drei Täler und drei Rücken treffen sich in einem Punkt. Die Hesse-Matrix ist dort null." }
};
function sceneFlaeche() {
    let kind = "sattel", x0 = 1, y0 = 0.6, plane = true; const R = 2.2, N = 70;
    const build = () => {
        const S = surfaces[kind], f = S.f, g = new THREE.Group(), w = new THREE.Group(); w.rotation.x = -Math.PI / 2; g.add(w);   // Mathe-z zeigt nach oben
        const pos = [], col = [], idx = []; let lo = Infinity, hi = -Infinity; const zs = [];
        for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) { const x = -R + 2 * R * i / N, y = -R + 2 * R * j / N, z = f(x, y); zs.push(z); lo = Math.min(lo, z); hi = Math.max(hi, z); pos.push(x, y, z); }
        zs.forEach(z => col.push(...ramp((z - lo) / (hi - lo || 1))));
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1; idx.push(a, b, d, a, d, c); }
        const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); geo.setIndex(idx); geo.computeVertexNormals();
        w.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.5, metalness: 0.05 })));
        const lp = []; for (let k = 0; k <= N; k += 5) for (let i = 0; i < N; i++) { const a = -R + 2 * R * i / N, b = -R + 2 * R * (i + 1) / N, c = -R + 2 * R * k / N; lp.push(a, c, f(a, c) + 0.004, b, c, f(b, c) + 0.004, c, a, f(c, a) + 0.004, c, b, f(c, b) + 0.004); }
        const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3)); w.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x0a0e1c, transparent: true, opacity: 0.4 })));
        const h = 1e-4, z0 = f(x0, y0), fx = (f(x0 + h, y0) - f(x0 - h, y0)) / (2 * h), fy = (f(x0, y0 + h) - f(x0, y0 - h)) / (2 * h), gl = Math.hypot(fx, fy), P = new THREE.Vector3(x0, y0, z0);
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 24, 16), new THREE.MeshBasicMaterial({ color: C.red })); dot.position.copy(P); w.add(dot);
        const base = lo - 0.5;
        w.add(line([P, new THREE.Vector3(x0, y0, base)], C.text, { dashed: true, opacity: 0.6 }));
        if (gl > 1e-3) {
            const up = new THREE.Vector3(fx, fy, gl * gl).normalize(), len = Math.min(1.6, 0.35 + gl * 0.9);
            w.add(new THREE.ArrowHelper(up, P, len, C.red, 0.22, 0.13));
            w.add(new THREE.ArrowHelper(new THREE.Vector3(fx, fy, 0).normalize(), new THREE.Vector3(x0, y0, base), Math.min(1.4, 0.3 + gl * 0.8), C.yellow, 0.2, 0.12));
        }
        if (plane) {
            const n = new THREE.Vector3(-fx, -fy, 1).normalize(), tp = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), new THREE.MeshBasicMaterial({ color: C.text, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }));
            tp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n); tp.position.copy(P).addScaledVector(n, 0.01); w.add(tp);
            const fr = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.5, 1.5)), new THREE.LineBasicMaterial({ color: C.text, transparent: true, opacity: 0.7 })); fr.quaternion.copy(tp.quaternion); fr.position.copy(tp.position); w.add(fr);
        }
        const grid = new THREE.GridHelper(2 * R, 8, C.grid, C.grid); grid.rotation.x = Math.PI / 2; grid.position.z = base; grid.material.transparent = true; grid.material.opacity = 0.6; w.add(grid);
        const lx = label("x", "#98a2bd", 0.3), ly = label("y", "#98a2bd", 0.3); lx.position.set(R + 0.3, -R, base); ly.position.set(-R, R + 0.3, base); w.add(lx, ly);
        setGroup(g);
        readout([["f(x₀, y₀)", "= " + fmt(z0)], ["Gradient", `(${fmt(fx)} | ${fmt(fy)})`], [`Steigung in Gradientenrichtung: ${fmt(gl)} · ${gl < 0.05 ? "kritischer Punkt" : "roter Pfeil = steilster Anstieg, gelb = Richtung in der x-y-Ebene"}`, "", true]]);
    };
    $("panel").innerHTML = seg("surfSeg", Object.keys(surfaces).map(k => [k, surfaces[k].name]), kind) + slider("px", "Punkt x₀", -2, 2, 0.05, x0) + slider("py", "Punkt y₀", -2, 2, 0.05, y0) +
        `<label class="check"><input type="checkbox" id="tp" checked> Tangentialebene zeigen</label><div class="fx"><span id="surfFx"></span><span>∇f = (∂f/∂x, ∂f/∂y)</span></div><p class="idea" id="surfIdea"></p>` + practice("CM-E-08", "Gradienten üben");
    const sync = () => { $("v_px").textContent = fmt(x0); $("v_py").textContent = fmt(y0); $("surfFx").innerHTML = surfaces[kind].tex; $("surfIdea").textContent = surfaces[kind].idea; };
    bindSeg("surfSeg", k => { kind = k; sync(); build(); });
    $("px").addEventListener("input", e => { x0 = Number(e.target.value); sync(); build(); });
    $("py").addEventListener("input", e => { y0 = Number(e.target.value); sync(); build(); });
    $("tp").addEventListener("change", e => { plane = e.target.checked; build(); });
    bindSpin(); camera.position.set(6.2, 5, 7.8); controls.target.set(0, -0.4, 0); sync(); build(); tick = null;
}

// ---------- Szene 4: Euler-Spirale ----------
function sceneEuler() {
    let omega = 1, t = 0, playing = !reduceMotion; const T = 4 * Math.PI, L = 6.4, wall = 1.7, X = s => -L / 2 + L * s / T;
    let marker, toSin, toCos, radius, pSin, pCos;
    const build = () => {
        const g = new THREE.Group(), hel = [], sn = [], cs = [];
        for (let i = 0; i <= 400; i++) { const s = T * i / 400, a = omega * s; hel.push(new THREE.Vector3(X(s), Math.sin(a), Math.cos(a))); sn.push(new THREE.Vector3(X(s), Math.sin(a), -wall)); cs.push(new THREE.Vector3(X(s), -wall, Math.cos(a))); }
        g.add(tube(hel, C.text, 0.03), tube(sn, C.teal, 0.022), tube(cs, C.yellow, 0.022));
        g.add(line([new THREE.Vector3(-L / 2 - 0.3, 0, 0), new THREE.Vector3(L / 2 + 0.5, 0, 0)], C.text, { dashed: true, opacity: 0.45 }));
        const circle = []; for (let i = 0; i <= 64; i++) { const a = 2 * Math.PI * i / 64; circle.push(new THREE.Vector3(-L / 2, Math.sin(a), Math.cos(a))); } g.add(line(circle, C.text, { opacity: 0.35 }));
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x141a30, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false });
        const back = new THREE.Mesh(new THREE.PlaneGeometry(L + 0.8, 2 * wall), wallMat); back.position.set(0.1, 0, -wall - 0.01); g.add(back);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(L + 0.8, 2 * wall), wallMat); floor.rotation.x = -Math.PI / 2; floor.position.set(0.1, -wall - 0.01, 0); g.add(floor);
        const l1 = label("sin(ωt)", "#35e0c4", 0.34), l2 = label("cos(ωt)", "#f5c518", 0.34), l3 = label("t", "#98a2bd", 0.3), l4 = label("Im", "#98a2bd", 0.28), l5 = label("Re", "#98a2bd", 0.28);
        l1.position.set(L / 2 - 0.4, 1.35, -wall); l2.position.set(L / 2 - 0.4, -wall + 0.25, 1.35); l3.position.set(L / 2 + 0.75, 0, 0); l4.position.set(-L / 2, 1.3, 0); l5.position.set(-L / 2, 0, 1.35); g.add(l1, l2, l3, l4, l5);
        marker = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), new THREE.MeshBasicMaterial({ color: C.red })); pSin = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: C.teal })); pCos = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: C.yellow }));
        const mk = c => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.75 })); l.frustumCulled = false; return l; };
        toSin = mk(C.teal); toCos = mk(C.yellow); radius = mk(C.red);
        g.add(marker, pSin, pCos, toSin, toCos, radius);
        setGroup(g); place();
    };
    const place = () => {
        const a = omega * t, x = X(t), y = Math.sin(a), z = Math.cos(a); marker.position.set(x, y, z); pSin.position.set(x, y, -wall); pCos.position.set(x, -wall, z);
        const set = (l, p, q) => { l.geometry.setFromPoints([p, q]); };
        set(toSin, marker.position, pSin.position); set(toCos, marker.position, pCos.position); set(radius, new THREE.Vector3(x, 0, 0), marker.position);
        readout([["e^(iωt)", `= ${fmt(z)} ${y < 0 ? "−" : "+"} ${fmt(Math.abs(y))} i`], ["Winkel ωt", "= " + fmt(a) + " rad = " + fmt(a * 180 / Math.PI, 0) + "°"], ["Die Spirale ist ein Kreis, der in der Zeit weiterläuft. Ihr Schatten an der Wand ist der Sinus, am Boden der Kosinus.", "", true]]);
        $("v_et").textContent = fmt(t); if (document.activeElement !== $("et")) $("et").value = t;
    };
    $("panel").innerHTML = slider("om", "Kreisfrequenz ω", 0.5, 3, 0.1, 1) + slider("et", "Zeit t", 0, T.toFixed(3), 0.01, 0) +
        `<div class="fx"><span>e<sup>iφ</sup> = cos φ + i · sin φ</span><span>e<sup>iπ</sup> + 1 = 0</span></div><p class="idea">Ein Punkt läuft gleichmäßig im Kreis. Trägt man die Zeit als dritte Achse auf, entsteht eine Spirale. So hängen Kreisbewegung, Schwingung und komplexe Zahlen zusammen.</p>` +
        `<div class="panel-actions"><button class="btn btn-teal btn-sm" type="button" id="play">${playing ? "❚❚ Pause" : "▶ Abspielen"}</button><a class="btn btn-primary btn-sm" href="ueben.html?thema=CM-S-46&zurueck=${encodeURIComponent("labor3d.html?szene=euler")}">Komplexe Zahlen üben →</a><button class="btn btn-ghost btn-sm" type="button" id="spinBtn">↻ Drehen</button></div>`;
    $("v_om").textContent = fmt(omega, 1);
    $("om").addEventListener("input", e => { omega = Number(e.target.value); $("v_om").textContent = fmt(omega, 1); build(); });
    $("et").addEventListener("input", e => { t = Number(e.target.value); playing = false; $("play").textContent = "▶ Abspielen"; place(); });
    $("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "❚❚ Pause" : "▶ Abspielen"; });
    bindSpin(); camera.position.set(5.8, 3.4, 10); controls.target.set(0, -0.3, 0); controls.autoRotate = false;
    build(); let last = performance.now();
    tick = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (playing) { t = (t + dt * 1.1) % T; place(); } };
}

// ---------- Steuerung ----------
const SCENES = [
    ["koerper", "Klasse 4–10", "Körper", "Volumen und <em>Oberfläche</em>", "Verändere die Maße und beobachte beide Größen", sceneKoerper, "3D-Körper mit einstellbaren Maßen"],
    ["rotation", "Klasse 12", "Rotationskörper", "Dreh eine Kurve zu einem <em>Körper</em>", "Jede Scheibe ist ein Kreis", sceneRotation, "Rotationskörper einer Funktion"],
    ["flaeche", "Studium", "Funktionsgebirge", "Wohin geht es am <em>steilsten</em> bergauf?", "Gradient und Tangentialebene einer Funktion z = f(x, y)", sceneFlaeche, "Fläche einer Funktion zweier Variablen mit Gradient"],
    ["euler", "Klasse 10 bis Studium", "Euler-Spirale", "Kreis, Schwingung, <em>komplexe Zahl</em>", "e^(iωt) als Spirale in der Zeit", sceneEuler, "Spirale der komplexen Exponentialfunktion mit Sinus- und Kosinus-Schatten"]
];
function bindSpin() { const b = $("spinBtn"); if (b) b.addEventListener("click", () => { controls.autoRotate = !controls.autoRotate; }); }
function open(key) {
    const s = SCENES.find(x => x[0] === key) || SCENES[0]; current = s[0];
    [...$("tabs").children].forEach(b => b.setAttribute("aria-selected", b.dataset.k === current));
    $("sTitle").innerHTML = s[3]; $("sSub").textContent = s[4]; renderer.domElement.setAttribute("aria-label", s[6] + ". Ziehen dreht die Ansicht.");
    controls.autoRotate = !reduceMotion; s[5](); controls.update();
    history.replaceState(null, "", "labor3d.html?szene=" + current);
}
$("tabs").innerHTML = SCENES.map(s => `<button class="tab" role="tab" type="button" data-k="${s[0]}"><small>${s[1]}</small><b>${s[2]}</b></button>`).join("");
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) open(b.dataset.k); });

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
let visible = true; document.addEventListener("visibilitychange", () => { visible = !document.hidden; });
renderer.setAnimationLoop(now => { if (!visible) return; if (tick) tick(now); controls.update(); renderer.render(scene, camera); });

open(new URLSearchParams(location.search).get("szene"));
window.__LAB3D = { open, scenes: SCENES.map(s => s[0]) };
</script>
