<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lehrplan-Matrix Klasse 1–12 | Second-Order Resonance</title>
    <meta name="description" content="Schulstoff Klasse 1–12 systematisch den SOR-Archivsektionen L1–L3 zugeordnet.">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --bg: #1a1a2e;
            --secondary: #16213e;
            --panel: #0f172a;
            --accent: #e94560;
            --text: #eef;
            --muted: #9aa;
            --gold: #f5c518;
            --line: rgba(255,255,255,0.11);
            --success: #4ade80;
            --l1: #4ade80;
            --l2: #facc15;
            --l3: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(233,69,96,0.14), transparent 28rem),
                linear-gradient(180deg, #1a1a2e 0%, #10182e 52%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(22,33,62,0.94);
            border-bottom: 1px solid rgba(233,69,96,0.28);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.2rem;
            gap: 0.8rem;
        }
        .logo { font-weight: 900; color: var(--gold); letter-spacing: 0.02em; }
        .logo span { color: var(--accent); }
        .top-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }
        .nav-link {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border-radius: 999px;
            padding: 0.42rem 0.8rem;
            font-size: 0.82rem;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        .shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        .page-header {
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 1.65rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        .page-header h1 span { color: var(--gold); }
        .page-header p {
            color: var(--muted);
            font-size: 0.92rem;
            max-width: 580px;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.6rem;
        }
        .filter-btn {
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.04);
            color: var(--muted);
            border-radius: 999px;
            padding: 0.35rem 0.85rem;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: rgba(233,69,96,0.2);
            color: var(--text);
            border-color: rgba(233,69,96,0.5);
        }
        .filter-btn[data-level="L1"].active { background: rgba(74,222,128,0.15); border-color: var(--l1); color: var(--l1); }
        .filter-btn[data-level="L2"].active { background: rgba(250,204,21,0.15); border-color: var(--l2); color: var(--l2); }
        .filter-btn[data-level="L3"].active { background: rgba(249,115,22,0.15); border-color: var(--l3); color: var(--l3); }

        .phase-block {
            margin-bottom: 1.4rem;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
        }
        .phase-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.85rem 1rem;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid var(--line);
        }
        .phase-badge {
            font-size: 0.7rem;
            font-weight: 900;
            padding: 0.22rem 0.6rem;
            border-radius: 999px;
            letter-spacing: 0.05em;
        }
        .badge-l1 { background: rgba(74,222,128,0.2); color: var(--l1); border: 1px solid rgba(74,222,128,0.35); }
        .badge-l2 { background: rgba(250,204,21,0.2); color: var(--l2); border: 1px solid rgba(250,204,21,0.35); }
        .badge-l3 { background: rgba(249,115,22,0.2); color: var(--l3); border: 1px solid rgba(249,115,22,0.35); }
        .phase-title {
            font-weight: 900;
            font-size: 0.97rem;
        }
        .phase-grades {
            font-size: 0.8rem;
            color: var(--muted);
            margin-left: auto;
        }

        .topic-table {
            width: 100%;
            border-collapse: collapse;
        }
        .topic-table th {
            text-align: left;
            font-size: 0.73rem;
            color: var(--muted);
            font-weight: 700;
            padding: 0.55rem 1rem;
            border-bottom: 1px solid var(--line);
            background: rgba(255,255,255,0.02);
            letter-spacing: 0.04em;
        }
        .topic-table td {
            padding: 0.55rem 1rem;
            font-size: 0.84rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }
        .topic-table tr:last-child td { border-bottom: none; }
        .topic-table tr:hover td { background: rgba(255,255,255,0.03); }

        .topic-name { color: var(--text); }
        .sublevel-code {
            font-family: "Courier New", monospace;
            font-size: 0.76rem;
            color: var(--accent);
            white-space: nowrap;
        }
        .sublevel-title {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .archive-link {
            display: inline-block;
            font-size: 0.72rem;
            padding: 0.18rem 0.5rem;
            border-radius: 6px;
            border: 1px solid rgba(233,69,96,0.3);
            color: var(--accent);
            background: rgba(233,69,96,0.08);
            white-space: nowrap;
            text-decoration: none;
        }
        .archive-link:hover { background: rgba(233,69,96,0.2); }

        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.8rem;
            font-size: 0.83rem;
        }
        .summary-stat { display: flex; flex-direction: column; gap: 0.2rem; }
        .summary-stat strong { font-size: 1.2rem; font-weight: 900; color: var(--gold); }
        .summary-stat span { color: var(--muted); font-size: 0.76rem; }

        @media (max-width: 600px) {
            .topic-table th:nth-child(3),
            .topic-table td:nth-child(3) { display: none; }
            .phase-grades { display: none; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <a href="lernpfad.html" class="logo">Second&#8209;Order <span>Resonance</span></a>
    <nav class="top-actions">
        <a href="lernpfad.html" class="nav-link">🗺 Lernpfad</a>
        <a href="lernarchiv.html" class="nav-link">📚 Archiv</a>
        <a href="../index.html" class="nav-link">🏠 Start</a>
    </nav>
</header>

<main class="shell">
    <div class="page-header">
        <h1>Lehrplan-Matrix <span>Klasse 1–12</span></h1>
        <p>Alle zentralen Schulmathematik-Themen von Klasse 1 bis 12, systematisch den L1–L3 Archivsektionen zugeordnet.</p>
    </div>

    <div class="summary-bar" id="summaryBar">
        <div class="summary-stat"><strong id="statTotal">—</strong><span>Themengebiete</span></div>
        <div class="summary-stat"><strong id="statL1">—</strong><span>L1-Themen</span></div>
        <div class="summary-stat"><strong id="statL2">—</strong><span>L2-Themen</span></div>
        <div class="summary-stat"><strong id="statL3">—</strong><span>L3-Themen</span></div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-level="ALL">Alle Klassen</button>
        <button class="filter-btn" data-level="L1">🟢 L1 Grundlagen (Kl. 1–6)</button>
        <button class="filter-btn" data-level="L2">🟡 L2 Aufbauwissen (Kl. 7–10)</button>
        <button class="filter-btn" data-level="L3">🟠 L3 Vertiefung (Kl. 11–12)</button>
    </div>

    <div id="matrixContainer"></div>
</main>

<script src="data/curriculum-matrix.js"></script>
<script>
(function () {
    const data = window.SOR_CURRICULUM;
    if (!data) return;

    const container = document.getElementById("matrixContainer");
    let activeLevel = "ALL";

    function levelClass(levelCode) {
        if (levelCode === "1") return "badge-l1";
        if (levelCode === "2") return "badge-l2";
        if (levelCode === "3") return "badge-l3";
        return "";
    }

    function archiveHref(sublevel, levelCode) {
        return `lernarchiv.html?level=${levelCode}&sublevel=${encodeURIComponent(sublevel)}`;
    }

    function render() {
        container.innerHTML = "";
        const phases = data.phases.filter(p =>
            activeLevel === "ALL" || p.level === activeLevel
        );

        phases.forEach(phase => {
            const block = document.createElement("div");
            block.className = "phase-block";

            const header = document.createElement("div");
            header.className = "phase-header";
            header.innerHTML = `
                <span class="phase-badge ${levelClass(phase.levelCode)}">${phase.level}</span>
                <span class="phase-title">${phase.phase}</span>
                <span class="phase-grades">${phase.grades}</span>
            `;
            block.appendChild(header);

            const table = document.createElement("table");
            table.className = "topic-table";
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Schulthema</th>
                        <th>Archivsektion</th>
                        <th>Sektionsname</th>
                        <th></th>
                    </tr>
                </thead>
            `;
            const tbody = document.createElement("tbody");
            phase.topics.forEach(t => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="topic-name">${t.topic}</td>
                    <td><span class="sublevel-code">${t.sublevel}</span></td>
                    <td><span class="sublevel-title">${t.sublevelTitle}</span></td>
                    <td><a class="archive-link" href="${archiveHref(t.sublevel, phase.levelCode)}">Zum Archiv →</a></td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            block.appendChild(table);
            container.appendChild(block);
        });
    }

    function updateStats() {
        const all = data.phases.flatMap(p => p.topics);
        const l1 = data.phases.filter(p => p.levelCode === "1").flatMap(p => p.topics);
        const l2 = data.phases.filter(p => p.levelCode === "2").flatMap(p => p.topics);
        const l3 = data.phases.filter(p => p.levelCode === "3").flatMap(p => p.topics);
        document.getElementById("statTotal").textContent = all.length;
        document.getElementById("statL1").textContent = l1.length;
        document.getElementById("statL2").textContent = l2.length;
        document.getElementById("statL3").textContent = l3.length;
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            activeLevel = btn.dataset.level;
            render();
        });
    });

    updateStats();
    render();
})();
</script>
</body>
</html>
