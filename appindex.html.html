<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLevel - Interaktiv Mathe lernen | Second-Order Resonance</title>
    <meta name="description" content="Kostenlose interaktive Mathe-App. Lerne Mathematik von Grundlagen bis Ingenieur-Level mit Uebungen und Erklaerungen.">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eee;
            --text-muted: #aaa;
            --gold: #f5c518;
            --success: #4ade80;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
        }

        /* App Header */
        .app-header {
            background: var(--secondary);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(233, 69, 96, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--gold);
        }

        .app-logo span { color: var(--accent); }

        .xp-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .xp-bar-track {
            width: 120px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 4px;
            transition: width 0.5s;
        }

        .xp-text { font-size: 0.85rem; color: var(--gold); }
        .streak { font-size: 0.9rem; }

        /* Main Layout */
        .app-main {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Level Selection */
        .level-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .level-btn {
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .level-btn:hover, .level-btn.active {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .level-btn .level-num {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
            margin-bottom: 0.3rem;
        }

        .level-btn .level-name { font-size: 0.8rem; color: var(--text-muted); }

        .l1 .level-num { color: #4ade80; }
        .l2 .level-num { color: #60a5fa; }
        .l3 .level-num { color: #f59e0b; }
        .l4 .level-num { color: #ef4444; }
        .l5 .level-num { color: #8b5cf6; }

        /* Topic Selection */
        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .topic-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .topic-btn:hover, .topic-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Exercise Card */
        .exercise-card {
            background: var(--secondary);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .exercise-tag {
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .tag-easy { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .tag-medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .tag-hard { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .exercise-progress { color: var(--text-muted); font-size: 0.9rem; }

        .question {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .math-expression {
            font-size: 2rem;
            text-align: center;
            padding: 1.5rem;
            margin: 1.5rem 0;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            color: var(--gold);
        }

        /* Answer Options */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .option-btn {
            padding: 1.2rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }

        .option-btn:hover {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .option-btn:disabled { cursor: default; opacity: 0.7; }

        /* Feedback */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 12px;
            display: none;
        }

        .feedback.show { display: block; }

        .feedback.correct-fb {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .feedback.wrong-fb {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .feedback h4 { margin-bottom: 0.5rem; }
        .feedback p { color: var(--text-muted); line-height: 1.6; }

        .next-btn {
            margin-top: 1.5rem;
            padding: 1rem 2rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: none;
        }

        .next-btn.show { display: block; }
        .next-btn:hover { background: #ff5a78; }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            background: var(--secondary);
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); }

        /* YouTube CTA */
        .yt-cta {
            background: linear-gradient(135deg, var(--accent2), var(--secondary));
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .yt-cta h3 { margin-bottom: 0.5rem; }
        .yt-cta p { color: var(--text-muted); margin-bottom: 1rem; }

        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            background: #ff0000;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .yt-btn:hover { background: #cc0000; transform: translateY(-2px); }

        /* Responsive */
        @media (max-width: 600px) {
            .options { grid-template-columns: 1fr; }
            .level-select { grid-template-columns: repeat(3, 1fr); }
            .math-expression { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="app-logo">Math<span>Level</span></div>
        <div class="xp-bar">
            <div class="xp-bar-track">
                <div class="xp-bar-fill" id="xpFill" style="width: 30%"></div>
            </div>
            <span class="xp-text" id="xpText">150 XP</span>
        </div>
        <div class="streak" id="streak">3 Tage</div>
    </header>

    <main class="app-main">

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="correctCount">0</div>
                <div class="stat-label">Richtig</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Aufgaben</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="accuracyPct">-</div>
                <div class="stat-label">Genauigkeit</div>
            </div>
        </div>

        <!-- Level Selection -->
        <div class="level-select">
            <button class="level-btn l1 active" onclick="selectLevel(0)">
                <span class="level-num">1</span>
                <span class="level-name">Grundlagen</span>
            </button>
            <button class="level-btn l2" onclick="selectLevel(1)">
                <span class="level-num">2</span>
                <span class="level-name">Mittelstufe</span>
            </button>
            <button class="level-btn l3" onclick="selectLevel(2)">
                <span class="level-num">3</span>
                <span class="level-name">Oberstufe</span>
            </button>
            <button class="level-btn l4" onclick="selectLevel(3)">
                <span class="level-num">4</span>
                <span class="level-name">Uni</span>
            </button>
            <button class="level-btn l5" onclick="selectLevel(4)">
                <span class="level-num">5</span>
                <span class="level-name">Ingenieur</span>
            </button>
        </div>

        <!-- Topics -->
        <div class="topics" id="topicsContainer"></div>

        <!-- Exercise -->
        <div class="exercise-card" id="exerciseCard">
            <div class="exercise-header">
                <span class="exercise-tag tag-easy" id="diffTag">Einfach</span>
                <span class="exercise-progress" id="progressText">Aufgabe 1</span>
            </div>
            <div class="question" id="questionText"></div>
            <div class="math-expression" id="mathExpr"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback">
                <h4 id="feedbackTitle"></h4>
                <p id="feedbackText"></p>
            </div>
            <button class="next-btn" id="nextBtn" onclick="nextExercise()">Naechste Aufgabe</button>
        </div>

        <!-- YouTube CTA -->
        <div class="yt-cta">
            <h3>Mehr davon auf YouTube</h3>
            <p>Ausfuehrliche Video-Erklaerungen zu jedem Thema mit Animationen und Beispielen</p>
            <a href="https://www.youtube.com/@Second-OrderResonance?sub_confirmation=1" target="_blank" class="yt-btn">
                Kanal abonnieren
            </a>
        </div>
    </main>

    <script>
        // Exercise Database
        const exercises = {
            0: { // Level 1 - Grundlagen
                topics: ["Bruchrechnung", "Prozente", "Geometrie", "Dreisatz"],
                questions: [
                    {
                        topic: "Bruchrechnung",
                        question: "Berechne:",
                        math: "1/2 + 1/3 = ?",
                        options: ["2/5", "5/6", "1/5", "2/6"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "Hauptnenner finden: 6. Also 3/6 + 2/6 = 5/6. Die Nenner muessen gleich sein, bevor man die Zaehler addieren kann."
                    },
                    {
                        topic: "Bruchrechnung",
                        question: "Vereinfache:",
                        math: "12/18 = ?",
                        options: ["3/4", "2/3", "6/9", "4/6"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "GGT von 12 und 18 ist 6. Also 12/6 = 2 und 18/6 = 3. Ergebnis: 2/3."
                    },
                    {
                        topic: "Prozente",
                        question: "Berechne:",
                        math: "25% von 80 = ?",
                        options: ["15", "20", "25", "30"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "25% = 1/4. Also 80 / 4 = 20. Alternativ: 80 * 0.25 = 20."
                    },
                    {
                        topic: "Geometrie",
                        question: "Wie gross ist die Flaeche eines Kreises mit Radius r = 3?",
                        math: "A = pi * r^2 = ?",
                        options: ["9pi", "6pi", "3pi", "12pi"],
                        correct: 0,
                        difficulty: "easy",
                        explanation: "A = pi * r^2 = pi * 3^2 = pi * 9 = 9pi (ungefaehr 28.27)."
                    },
                    {
                        topic: "Dreisatz",
                        question: "3 Aepfel kosten 1.50 Euro. Wie viel kosten 7 Aepfel?",
                        math: "3 -> 1.50 EUR\n7 -> ? EUR",
                        options: ["3.00", "3.50", "4.00", "4.50"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "1 Apfel = 1.50/3 = 0.50 EUR. Also 7 Aepfel = 7 * 0.50 = 3.50 EUR."
                    }
                ]
            },
            1: { // Level 2 - Mittelstufe
                topics: ["Gleichungen", "Funktionen", "Trigonometrie", "Potenzen"],
                questions: [
                    {
                        topic: "Gleichungen",
                        question: "Loese nach x auf:",
                        math: "3x + 7 = 22",
                        options: ["x = 3", "x = 5", "x = 7", "x = 10"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "3x + 7 = 22 => 3x = 15 => x = 5. Immer erst Konstante subtrahieren, dann durch den Koeffizienten teilen."
                    },
                    {
                        topic: "Gleichungen",
                        question: "Loese die quadratische Gleichung:",
                        math: "x^2 - 5x + 6 = 0",
                        options: ["x = 1, x = 6", "x = 2, x = 3", "x = -2, x = -3", "x = 3, x = -2"],
                        correct: 1,
                        difficulty: "medium",
                        explanation: "Faktorisieren: (x-2)(x-3) = 0. Also x = 2 oder x = 3. Tipp: Welche Zahlen ergeben multipliziert 6 und addiert 5?"
                    },
                    {
                        topic: "Funktionen",
                        question: "Wo schneidet die Funktion die x-Achse?",
                        math: "f(x) = 2x - 6",
                        options: ["x = 2", "x = 3", "x = 6", "x = -3"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "Nullstelle: f(x) = 0 => 2x - 6 = 0 => 2x = 6 => x = 3. Die Funktion schneidet die x-Achse bei (3|0)."
                    },
                    {
                        topic: "Potenzen",
                        question: "Vereinfache:",
                        math: "(2^3)^2 = ?",
                        options: ["32", "64", "128", "12"],
                        correct: 1,
                        difficulty: "easy",
                        explanation: "Potenzregel: (a^m)^n = a^(m*n). Also (2^3)^2 = 2^6 = 64."
                    },
                    {
                        topic: "Trigonometrie",
                        question: "In einem rechtwinkligen Dreieck mit Hypotenuse 10 und Gegenkathete 6:",
                        math: "sin(alpha) = ?",
                        options: ["0.6", "0.8", "0.5", "0.75"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "sin(alpha) = Gegenkathete / Hypotenuse = 6/10 = 0.6. Merke: SOH - Sinus = Opposite / Hypotenuse."
                    }
                ]
            },
            2: { // Level 3 - Oberstufe
                topics: ["Ableitungen", "Integrale", "Stochastik", "Vektoren"],
                questions: [
                    {
                        topic: "Ableitungen",
                        question: "Bestimme die Ableitung:",
                        math: "f(x) = x^3 + 2x^2 - 5x\nf'(x) = ?",
                        options: ["3x^2 + 4x - 5", "3x^2 + 2x - 5", "x^2 + 4x - 5", "3x^3 + 4x^2 - 5x"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "Potenzregel: d/dx [x^n] = n*x^(n-1). Also: 3x^2 + 4x - 5. Jeder Term wird einzeln abgeleitet."
                    },
                    {
                        topic: "Ableitungen",
                        question: "Bestimme die Ableitung mit Produktregel:",
                        math: "f(x) = x^2 * sin(x)\nf'(x) = ?",
                        options: ["2x * cos(x)", "x^2 * cos(x) + 2x * sin(x)", "2x * sin(x)", "x^2 * sin(x) + 2x * cos(x)"],
                        correct: 1,
                        difficulty: "hard",
                        explanation: "Produktregel: (uv)' = u'v + uv'. Mit u=x^2, v=sin(x): f'(x) = 2x*sin(x) + x^2*cos(x)."
                    },
                    {
                        topic: "Integrale",
                        question: "Berechne das Integral:",
                        math: "integral(2x + 3) dx = ?",
                        options: ["x^2 + 3x + C", "x^2 + 3 + C", "2x^2 + 3x + C", "x + 3x + C"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "Integration ist die Umkehrung der Ableitung. integral(2x)dx = x^2, integral(3)dx = 3x. Plus Konstante C!"
                    },
                    {
                        topic: "Vektoren",
                        question: "Berechne das Skalarprodukt:",
                        math: "a = (1, 2, 3), b = (4, 5, 6)\na * b = ?",
                        options: ["30", "32", "28", "36"],
                        correct: 1,
                        difficulty: "medium",
                        explanation: "Skalarprodukt: 1*4 + 2*5 + 3*6 = 4 + 10 + 18 = 32. Komponentenweise multiplizieren und aufaddieren."
                    },
                    {
                        topic: "Stochastik",
                        question: "2 Wuerfel werden geworfen. Wie hoch ist P(Summe = 7)?",
                        math: "P(X = 7) = ?",
                        options: ["1/6", "5/36", "6/36", "7/36"],
                        correct: 2,
                        difficulty: "medium",
                        explanation: "Moegliche Kombinationen fuer Summe 7: (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) = 6 von 36 Moeglichkeiten = 6/36 = 1/6."
                    }
                ]
            },
            3: { // Level 4 - Uni
                topics: ["Lineare Algebra", "DGL", "Komplexe Zahlen", "Reihen"],
                questions: [
                    {
                        topic: "Lineare Algebra",
                        question: "Berechne die Determinante:",
                        math: "|2  1|\n|3  4| = ?",
                        options: ["5", "11", "8", "-5"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "Fuer 2x2-Matrix: ad - bc = 2*4 - 1*3 = 8 - 3 = 5."
                    },
                    {
                        topic: "DGL",
                        question: "Loese die Differentialgleichung:",
                        math: "y' = 2y, y(0) = 1",
                        options: ["y = e^(2t)", "y = 2e^t", "y = e^t + 1", "y = 2t"],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "Trennung der Variablen: dy/y = 2dt => ln|y| = 2t + C => y = Ae^(2t). Mit y(0)=1: A=1. Also y = e^(2t)."
                    },
                    {
                        topic: "Komplexe Zahlen",
                        question: "Berechne:",
                        math: "(3 + 2i)(1 - i) = ?",
                        options: ["5 - i", "1 + 5i", "5 + i", "3 - 2i"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "Ausmultiplizieren: 3(1) + 3(-i) + 2i(1) + 2i(-i) = 3 - 3i + 2i - 2i^2 = 3 - i + 2 = 5 - i (weil i^2 = -1)."
                    },
                    {
                        topic: "Reihen",
                        question: "Bestimme den Konvergenzwert:",
                        math: "sum(n=0 to inf) (1/2)^n = ?",
                        options: ["1", "2", "unendlich", "1/2"],
                        correct: 1,
                        difficulty: "medium",
                        explanation: "Geometrische Reihe: sum q^n = 1/(1-q) fuer |q|<1. Mit q=1/2: 1/(1-1/2) = 1/(1/2) = 2."
                    },
                    {
                        topic: "Lineare Algebra",
                        question: "Sind diese Vektoren linear unabhaengig?",
                        math: "v1 = (1,0,0)\nv2 = (0,1,0)\nv3 = (1,1,0)",
                        options: ["Ja", "Nein", "Nur v1 und v2", "Nicht bestimmbar"],
                        correct: 1,
                        difficulty: "hard",
                        explanation: "v3 = v1 + v2, also ist v3 eine Linearkombination von v1 und v2. Die Vektoren sind linear abhaengig."
                    }
                ]
            },
            4: { // Level 5 - Ingenieur
                topics: ["Fourier", "Laplace", "Resonanz", "Regelungstechnik"],
                questions: [
                    {
                        topic: "Fourier",
                        question: "Was beschreibt die Fourier-Transformation?",
                        math: "F(w) = integral(-inf, inf) f(t) * e^(-jwt) dt",
                        options: [
                            "Zerlegung in Frequenzanteile",
                            "Loesung von DGL",
                            "Berechnung von Flaecheninhalt",
                            "Approximation von Polynomen"
                        ],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "Die Fourier-Transformation zerlegt ein Signal f(t) in seine Frequenzkomponenten F(w). Jede Frequenz hat eine Amplitude und Phase."
                    },
                    {
                        topic: "Laplace",
                        question: "Bestimme die Laplace-Transformierte:",
                        math: "L{e^(at)} = ?",
                        options: ["1/(s-a)", "1/(s+a)", "s/(s-a)", "a/(s-a)"],
                        correct: 0,
                        difficulty: "medium",
                        explanation: "L{e^(at)} = 1/(s-a) fuer Re(s) > a. Dies ist eine der wichtigsten Standardtransformationen."
                    },
                    {
                        topic: "Resonanz",
                        question: "Wann tritt Resonanz in einem System 2. Ordnung auf?",
                        math: "m*x'' + c*x' + k*x = F*cos(wt)",
                        options: [
                            "Wenn w = sqrt(k/m)",
                            "Wenn w = 0",
                            "Wenn c = 0",
                            "Wenn F = 0"
                        ],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "Resonanz tritt auf wenn die Anregungsfrequenz w gleich der Eigenfrequenz w0 = sqrt(k/m) ist. Dann wird die Amplitude maximal (bei Daempfung c>0) oder unendlich (bei c=0)."
                    },
                    {
                        topic: "Regelungstechnik",
                        question: "Was beschreibt die Uebertragungsfunktion eines PT1-Glieds?",
                        math: "G(s) = ?",
                        options: ["K/(1+Ts)", "K*s/(1+Ts)", "K/(s+T)", "K*T*s"],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "PT1-Glied (Verzoegerungsglied 1. Ordnung): G(s) = K/(1+Ts) mit Verstaerkung K und Zeitkonstante T. Grundbaustein der Regelungstechnik."
                    },
                    {
                        topic: "Fourier",
                        question: "Welche Eigenschaft hat die DFT (Diskrete Fourier-Transformation)?",
                        math: "X[k] = sum(n=0, N-1) x[n] * e^(-j2pi*kn/N)",
                        options: [
                            "Periodizitaet: X[k+N] = X[k]",
                            "X[k] ist immer reell",
                            "DFT ist nicht umkehrbar",
                            "Nur fuer gerade N definiert"
                        ],
                        correct: 0,
                        difficulty: "hard",
                        explanation: "Die DFT ist periodisch mit Periode N. Ausserdem ist sie umkehrbar (IDFT existiert) und fuer beliebiges N definiert."
                    }
                ]
            }
        };

        // App State
        let state = {
            level: 0,
            topic: null,
            questionIdx: 0,
            correct: 0,
            total: 0,
            xp: 150,
            answered: false
        };

        // Load saved state
        try {
            const saved = localStorage.getItem('mathlevel-state');
            if (saved) {
                const s = JSON.parse(saved);
                state.correct = s.correct || 0;
                state.total = s.total || 0;
                state.xp = s.xp || 150;
            }
        } catch(e) {}

        function saveState() {
            try {
                localStorage.setItem('mathlevel-state', JSON.stringify({
                    correct: state.correct,
                    total: state.total,
                    xp: state.xp
                }));
            } catch(e) {}
        }

        function selectLevel(level) {
            state.level = level;
            state.topic = null;
            state.questionIdx = 0;
            state.answered = false;

            document.querySelectorAll('.level-btn').forEach((b, i) => {
                b.classList.toggle('active', i === level);
            });

            renderTopics();
            renderExercise();
        }

        function renderTopics() {
            const container = document.getElementById('topicsContainer');
            const topics = exercises[state.level].topics;
            container.innerHTML = topics.map(t =>
                `<button class="topic-btn ${state.topic === t ? 'active' : ''}" onclick="selectTopic('${t}')">${t}</button>`
            ).join('');
        }

        function selectTopic(topic) {
            state.topic = state.topic === topic ? null : topic;
            state.questionIdx = 0;
            state.answered = false;
            renderTopics();
            renderExercise();
        }

        function getFilteredQuestions() {
            let qs = exercises[state.level].questions;
            if (state.topic) {
                qs = qs.filter(q => q.topic === state.topic);
            }
            return qs;
        }

        function renderExercise() {
            const qs = getFilteredQuestions();
            if (qs.length === 0) return;

            const q = qs[state.questionIdx % qs.length];

            // Difficulty tag
            const tag = document.getElementById('diffTag');
            tag.textContent = q.difficulty === 'easy' ? 'Einfach' : q.difficulty === 'medium' ? 'Mittel' : 'Schwer';
            tag.className = 'exercise-tag tag-' + q.difficulty;

            // Progress
            document.getElementById('progressText').textContent = `Aufgabe ${state.questionIdx + 1}`;

            // Question
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('mathExpr').textContent = q.math;

            // Options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = q.options.map((opt, i) =>
                `<button class="option-btn" onclick="checkAnswer(${i}, ${q.correct})" id="opt${i}">${opt}</button>`
            ).join('');

            // Hide feedback
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            state.answered = false;
        }

        function checkAnswer(selected, correct) {
            if (state.answered) return;
            state.answered = true;
            state.total++;

            const isCorrect = selected === correct;
            const feedback = document.getElementById('feedback');
            const qs = getFilteredQuestions();
            const q = qs[state.questionIdx % qs.length];

            // Highlight options
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                if (i === correct) btn.classList.add('correct');
                if (i === selected && !isCorrect) btn.classList.add('wrong');
            });

            if (isCorrect) {
                state.correct++;
                const xpGain = q.difficulty === 'easy' ? 10 : q.difficulty === 'medium' ? 20 : 30;
                state.xp += xpGain;
                feedback.className = 'feedback correct-fb show';
                document.getElementById('feedbackTitle').textContent = 'Richtig! +' + xpGain + ' XP';
            } else {
                feedback.className = 'feedback wrong-fb show';
                document.getElementById('feedbackTitle').textContent = 'Leider falsch';
            }

            document.getElementById('feedbackText').textContent = q.explanation;
            document.getElementById('nextBtn').className = 'next-btn show';

            updateStats();
            saveState();
        }

        function nextExercise() {
            state.questionIdx++;
            renderExercise();
        }

        function updateStats() {
            document.getElementById('correctCount').textContent = state.correct;
            document.getElementById('totalCount').textContent = state.total;
            document.getElementById('accuracyPct').textContent =
                state.total > 0 ? Math.round(state.correct / state.total * 100) + '%' : '-';
            document.getElementById('xpText').textContent = state.xp + ' XP';
            document.getElementById('xpFill').style.width = (state.xp % 500) / 5 + '%';
        }

        // Initialize
        renderTopics();
        renderExercise();
        updateStats();
    </script>

</body>
</html>
